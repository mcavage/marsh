[package]
name = "marsh-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Deliberate E2E behavior breaks (docs/design/test-breaks.md). Off in releases.
test-breaks = ["marsh-contracts/test-breaks"]

[lints]
workspace = true

[dependencies]
flate2 = "1"
getrandom = "0.4"
ignore = "0.4"
reflink-copy = "0.1"
marsh-acp = { path = "../marsh-acp" }
marsh-contracts = { path = "../marsh-contracts" }
marsh-provenance = { path = "../marsh-provenance" }
marsh-host-identity = { path = "../marsh-host-identity" }
marsh-runtime = { path = "../marsh-runtime" }
marsh-sbx = { path = "../marsh-sbx" }
rustix = { version = "1.1", features = ["fs", "process", "termios", "stdio", "event", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha1 = "0.11"
sha2 = "0.11"
similar = "3"
signal-hook = "0.4"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18", features = ["v4"] }

[build-dependencies]
marsh-provenance = { path = "../marsh-provenance", features = ["build"] }

[dev-dependencies]
marsh-runtime = { path = "../marsh-runtime", features = ["test-support"] }
marsh-sbx = { path = "../marsh-sbx", features = ["test-support"] }
nix = { version = "0.31", features = ["term"] }
tempfile = "3.23"
