[package]
name = "marsh-daemon"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
flate2 = "1"
getrandom = "0.3"
ignore = "0.4"
reflink-copy = "0.1"
marsh-acp = { path = "../marsh-acp" }
marsh-contracts = { path = "../marsh-contracts" }
marsh-host-identity = { path = "../marsh-host-identity" }
marsh-runtime = { path = "../marsh-runtime" }
marsh-sbx = { path = "../marsh-sbx" }
rustix = { version = "1.1", features = ["fs", "process", "termios", "stdio", "event"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
similar = "2"
signal-hook = "0.3"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
marsh-sbx = { path = "../marsh-sbx", features = ["test-support"] }
nix = { version = "0.31", features = ["term"] }
tempfile = "3.23"
