# marsh's curated model classes (docs/peer-review.md). A peer reviewer is a
# model of a different vendor in the same class as the agent's own model.
#
# Each rule is a glob (`*` matches any run of characters) tested, in order,
# against the model id (lowercased, without a `provider/` prefix or a cloud
# region prefix such as `us.` or `global.`) and then against its models.dev
# family. The first match wins, so narrow patterns come before broad ones.
#
# Only a model a rule names is eligible: marsh picks and lists no other model
# by itself (peer-review detection, `peer-review classify`, the `task` tool's
# model list, drop-in reviewers). A model no rule matches is still classed by
# its models.dev output price (`bands`), for display only, and is not
# eligible. `retired` globs name superseded models: they are never eligible,
# even where a rule below would match them.
#
# $MARSH_HOME/model-classes.yaml overrides this file: its `retired` globs and
# rules are tried first (so a rule there revives a retired model), and its
# `bands` replace these.

# Output price in USD per million tokens: below `small_below` is small, from
# `large_from` up is large, between is mid.
bands:
  small_below: 4
  large_from: 18

# Superseded models, by vendor: each has a newer model of the same vendor in
# the rules below (checked against models.dev release dates).
retired:
  # OpenAI: the o-series, GPT-3.5/4/4o/4.1 and GPT-5.x are succeeded by GPT-6.
  - "o1*"
  - "o3*"
  - "o4-mini*"
  - "gpt-3*"
  - "gpt-4*"
  - "gpt-5*"
  - "chatgpt*"
  - "codex-mini*"
  - "text-davinci*"
  # Anthropic: Claude 2 and 3, and the 4.x Opus, Sonnet and Haiku, are
  # succeeded by Claude 5.
  - "claude-2*"
  - "claude-3*"
  - "claude-instant*"
  - "claude-opus-4*"
  - "claude-sonnet-4*"
  - "claude-haiku-4*"
  # Google: Gemini 1, 2.0 and 2.5 Flash are succeeded by Gemini 3 Flash
  # (2.5 Pro stays until a non-preview Pro replaces it).
  - "gemini-1*"
  - "gemini-2.0*"
  - "gemini-2.5-flash*"
  - "gemini-exp*"
  - "gemini-pro-vision"
  # Open families
  - "deepseek-v2*"
  - "deepseek-v3*"
  - "deepseek-r1*"
  - "deepseek-coder*"
  - "qwen1*"
  - "qwen2*"
  - "qwen3-*"
  - "qwen3.5*"
  - "glm-3*"
  - "glm-4*"
  - "minimax-m1*"
  - "minimax-m2*"

rules:
  # Anthropic
  - {match: "claude-haiku-*", class: small, vendor: anthropic}
  - {match: "claude-*-haiku*", class: small, vendor: anthropic}
  - {match: "haiku", class: small, vendor: anthropic}
  - {match: "claude-sonnet-*", class: mid, vendor: anthropic}
  - {match: "claude-*-sonnet*", class: mid, vendor: anthropic}
  - {match: "sonnet", class: mid, vendor: anthropic}
  - {match: "claude-opus-*", class: large, vendor: anthropic}
  - {match: "claude-*-opus*", class: large, vendor: anthropic}
  - {match: "opus", class: large, vendor: anthropic}
  - {match: "claude-fable*", class: large, vendor: anthropic}
  - {match: "fable", class: large, vendor: anthropic}

  # OpenAI (gpt-oss is open weights, but still OpenAI's model)
  - {match: "gpt-oss-20b*", class: small, vendor: openai}
  - {match: "gpt-oss*", class: mid, vendor: openai}
  - {match: "gpt-*luna*", class: small, vendor: openai}
  - {match: "gpt-*-nano*", class: small, vendor: openai}
  - {match: "gpt-*-mini*", class: small, vendor: openai}
  - {match: "gpt-*terra*", class: mid, vendor: openai}
  - {match: "gpt-*sol*", class: large, vendor: openai}
  - {match: "gpt-*astra*", class: large, vendor: openai}

  # Google
  - {match: "gemma-*", class: small, vendor: google}
  - {match: "gemini-*flash*", class: small, vendor: google}
  - {match: "gemini-*pro*", class: mid, vendor: google}

  # DeepSeek
  - {match: "deepseek-*flash*", class: small, vendor: deepseek}
  - {match: "deepseek-*", class: mid, vendor: deepseek}

  # Alibaba Qwen
  - {match: "qwen*-flash*", class: small, vendor: alibaba}
  - {match: "qwen*-turbo*", class: small, vendor: alibaba}
  - {match: "qwen*-max*", class: large, vendor: alibaba}
  - {match: "qwen*", class: mid, vendor: alibaba}

  # Moonshot Kimi
  - {match: "kimi-k3*", class: large, vendor: moonshotai}
  - {match: "kimi-*", class: mid, vendor: moonshotai}

  # Z.ai GLM
  - {match: "glm-*flash*", class: small, vendor: zai}
  - {match: "glm-*air*", class: small, vendor: zai}
  - {match: "glm-*", class: mid, vendor: zai}

  # MiniMax
  - {match: "minimax-*flash*", class: small, vendor: minimax}
  - {match: "minimax-*", class: mid, vendor: minimax}

  # Mistral
  - {match: "ministral*", class: small, vendor: mistral}
  - {match: "mistral-small*", class: small, vendor: mistral}
  - {match: "mistral-medium*", class: mid, vendor: mistral}
  - {match: "devstral*", class: mid, vendor: mistral}
  - {match: "mistral-large*", class: large, vendor: mistral}
