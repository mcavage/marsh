[package]
name = "marsh-acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
test-support = []

[dependencies]
marsh-contracts = { path = "../marsh-contracts" }
bytes = "1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"

[[bin]]
name = "marsh-acp-fake-agent"
path = "src/bin/fake_agent.rs"
required-features = ["test-support"]

[dev-dependencies]
marsh-daemon = { path = "../marsh-daemon" }
marsh-mcp = { path = "../marsh-mcp" }
rmcp = { version = "3.4", default-features = false, features = ["client", "server", "transport-async-rw"] }
uuid = { version = "1", features = ["v4"] }
marsh-acp = { path = ".", features = ["test-support"] }
tempfile = "3"
