[package]
name = "marsh-sbx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Explicit host-only isolation seams for dependent-crate caller tests. No env override.
test-support = ["marsh-runtime/test-support"]

[dependencies]
marsh-contracts = { path = "../marsh-contracts" }
marsh-runtime = { path = "../marsh-runtime" }
marsh-worker = { path = "../marsh-worker" }
marsh-host-identity = { path = "../marsh-host-identity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
rustix = { version = "1", features = ["fs", "process", "net", "event"] }
thiserror = "2"
tempfile = "3.23"
uuid = { version = "1.18", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Descriptor-bound read-only ACL wrapper; exact source/notice reviewed by security.
calcifer-macos-acl = "=0.1.0"
# Existing workspace dependency; LOCAL SDK peer UID comes from the connected socket.
nix = { version = "0.31", features = ["socket"] }

[lints]
workspace = true
