[package]
name = "marsh-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Deliberate E2E behavior breaks (docs/design/test-breaks.md). Off in releases.
test-breaks = ["marsh-contracts/test-breaks", "marsh-daemon/test-breaks", "marsh-sbx/test-breaks"]

[dependencies]
flate2 = "1"
marsh-acp = { path = "../marsh-acp" }
marsh-contracts = { path = "../marsh-contracts" }
marsh-provenance = { path = "../marsh-provenance" }
marsh-daemon = { path = "../marsh-daemon" }
marsh-runtime = { path = "../marsh-runtime" }
marsh-sbx = { path = "../marsh-sbx" }
marsh-worker = { path = "../marsh-worker" }
nix = { version = "0.31", features = ["user"] }
rustix = { version = "1.1", features = ["process", "fs"] }
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
similar = "3"
signal-hook = "0.4"
tempfile = "3.23"

[build-dependencies]
marsh-provenance = { path = "../marsh-provenance", features = ["build"] }

[dev-dependencies]
marsh-sbx = { path = "../marsh-sbx", features = ["test-support"] }

[lints]
workspace = true
