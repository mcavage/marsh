[workspace]
members = [
    "crates/marsh",
    "crates/marsh-acp",
    "crates/marsh-backend",
    "crates/marsh-contracts",
    "crates/marsh-daemon",
    "crates/marsh-host-identity",
    "crates/marsh-mcp",
    "crates/marsh-runtime",
    "crates/marsh-sbx",
    "crates/marsh-worker",
]
exclude = ["vendor/brush"]
resolver = "3"

[workspace.package]
# The one place a version lives. Release CI stamps the real one (the tag, or a
# nightly's) with scripts/stamp-version.py and never commits it; local builds
# report this baseline.
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
