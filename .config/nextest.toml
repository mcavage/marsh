# cargo-nextest: one process per test (make test-rust; CI uses --profile ci).
# No retries: a test that fails once fails the run.

[profile.default]
# The longest tests take about 15 s on a 1.5-CPU Linux runner. A test still
# running at 30 s is reported as slow, and killed and failed by name at 2 min,
# instead of stalling the job until its timeout.
slow-timeout = { period = "30s", terminate-after = 4 }

# The #[ignore]d MCP relay load caller drives the built marsh, marsh-mcp and
# marshd through a whole load/revoke journey: 63 s on an M-series Mac. Killed
# at 5 min.
[[profile.default.overrides]]
filter = 'package(marsh-daemon) & test(=mcp_load_tests::load_via_relay_prepares_only_after_validation_and_preserves_publication)'
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
# Report every failure, not just the first.
fail-fast = false
