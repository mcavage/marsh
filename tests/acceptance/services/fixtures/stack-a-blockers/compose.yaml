# Stack A with the three things a fork cannot safely duplicate: a fixed
# container_name, an external volume and a volume with an explicit name.
# setup.sh pre-creates the external volume (nfx-ext) with a sentinel file.
services:
  db:
    image: postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "app"]
      interval: 1s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    # Sentinel key k, set once the server is up; nothing is persisted.
    command: ["sh", "-c", "(sleep 1; redis-cli set k seed >/dev/null) & exec redis-server --save '' --appendonly no"]
    ports:
      - "6379:6379"

  mail:
    image: axllent/mailpit:latest@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    container_name: nfx-mail
    ports:
      - "8025:8025"
      - "1025:1025"

  app:
    image: postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: devpass
      PGDATABASE: app
      LOAD: ${LOAD:-0}
    volumes:
      - uploads:/uploads
      - ext:/ext
      - fixed:/fixed
      - ./app:/app:ro
    command: ["bash", "/app/run.sh"]

volumes:
  pgdata:
  uploads:
  ext:
    external: true
    name: nfx-ext
  fixed:
    name: nfx-fixed
