# Stack A plus two services whose state is not in a named volume.
services:
  db:
    image: postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "app"]
      interval: 1s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    # Sentinel key k, set once the server is up; nothing is persisted.
    command: ["sh", "-c", "(sleep 1; redis-cli set k seed >/dev/null) & exec redis-server --save '' --appendonly no"]
    ports:
      - "6379:6379"

  mail:
    image: axllent/mailpit:latest@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports:
      - "8025:8025"
      - "1025:1025"

  app:
    image: postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: devpass
      PGDATABASE: app
      LOAD: ${LOAD:-0}
    volumes:
      - uploads:/uploads
      - ./app:/app:ro
    command: ["bash", "/app/run.sh"]

  # Postgres with only its image's anonymous volume (no volumes: entry here).
  anon:
    image: postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: anon

  # Keeps its state in its writable layer: no volume, no bind.
  writable:
    image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    command: ["sh", "-c", "[ -f /var/state ] || echo writable-seed > /var/state; exec sleep 1d"]

volumes:
  pgdata:
  uploads:
