# syntax=docker/sandbox-kit:3@sha256:11bb68806aef6a68d45c10c0c3b3dc86c2f794a296b5a933661d9dadf760b753
schemaVersion: "3"
displayName: marsh acceptance fixture
description: Credential-free workload for black-box marsh qualification
kind: workload
provides: ["marsh-acceptance-fixture@1.0.0"]
dockerfile: ./fixture.dockerfile
args:
  shellImage:
    description: Immutable DHI runtime base the Kit VM floor is assembled onto
    default: dhi.io/debian-base:trixie@sha256:20079b51710f0397da5e056bfc7156b6aafc7ff3aa4ef4cbcb0b0f1df99cd8c4
    pattern: '^[a-z0-9][a-z0-9._:/-]+@sha256:[a-f0-9]{64}$'
    buildArg: SHELL_IMAGE
capabilities:
  - type: com.docker.sandbox/sbx@1
  # Prompt verbs (agent-sessions@1): marsh's task tool starts the fixture as
  # an agent, `fixture exec sh -c PROMPT` (task_tool_uat.py).
  - type: com.docker.sandbox/agent-sessions@1
    config:
      prompt: ["exec", "sh", "-c", "{{.Prompt}}"]
  # Its model option (marsh's org.marsh/agent-model@1) lands in the prompt
  # script's $0 and $1 (`sh -c PROMPT --model M`).
  - type: org.marsh/agent-model@1
    optional: true
    config:
      args: ["--model", "{{.Model}}"]
