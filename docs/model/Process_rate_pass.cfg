\* marsh-check: mid 56s
\* The launch rate over time: one tree, the clock ticks twice, a window of
\* one tick, at most 2 launches per window. Launches resume as time passes;
\* no window ever holds more (RateBound).
SPECIFICATION Spec
CONSTANTS
  Jobs = {1, 2, 3}
  Kits = {"a"}
  ScriptKits = {"a"}
  NoHomeKits = {}
  MaxDepth = 2
  MaxConc = 2
  MaxFan = 2
  MaxRate = 2
  Window = 1
  MaxTime = 2
  MaxKitVMs = 1
  MaxDetached = 0
  MaxRestarts = 0
  LiveLimits = FALSE
  Bug = "none"
INVARIANTS
  TypeOK
  LineageWF
  BudgetBound
  FanOutBound
  RateBound
  LiveUnderLive
  NoOrphanRunning
