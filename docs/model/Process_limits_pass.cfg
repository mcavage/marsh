\* Limits changed while jobs run (`marsh config limit`): SetLimits lowers
\* every admission limit by one or puts it back, at any step. Every launch
\* fits the limits in effect when it is admitted (AdmittedUnderLimits); the
\* caps still hold, and nothing that runs is ended by a lowered limit.
