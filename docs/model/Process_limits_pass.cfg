  MaxConc = 2
  MaxFan = 2
  MaxRate = 3
  Window = 1
  MaxTime = 0
  MaxKitVMs = 1
  MaxDetached = 0
  MaxRestarts = 0
  LiveLimits = TRUE
  Bug = "none"
INVARIANTS
  TypeOK
  LineageWF
  Attenuation
  BudgetBound
  FanOutBound
  RateBound
  LiveUnderLive
  NoOrphanRunning
  CancelPropagates
  KitVMBound
  AdmittedUnderLimits
