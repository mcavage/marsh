# Hermes under marsh: first-run defaults, copied to ~/.hermes/config.yaml only
# when none exists, after the provider of the key you stored in SBX.
skills:
  # The skills folder every agent in this marsh home shares.
  external_dirs: [~/.agents/skills, /opt/hermes/kit-skills]
  create_dir: ~/.agents/skills

# Your prompts and data go only to your model provider. Telemetry to Nous
# Research stays off; the model list and update checks are Hermes's defaults.
telemetry:
  shared_metrics:
    enabled: false
    send: false
