# syntax=docker/sandbox-kit:3@sha256:11bb68806aef6a68d45c10c0c3b3dc86c2f794a296b5a933661d9dadf760b753
schemaVersion: "3"
displayName: Pix
description: Upstream Pi, public skills and display-only UI, orchestrated by marsh
sourceUrl: https://github.com/mcavage/pix
licenses: [MIT]
kind: workload
# marsh/kit_inputs.py derives these from marsh's Pi image; the defaults only
# keep a plain local `docker buildx build` working.
args:
  base:
    default: docker.io/mcavage/marsh-pi:latest
    pattern: '^docker\.io/mcavage/marsh-pi(:latest|@sha256:[0-9a-f]{64})$'
    description: marsh's packaged Pi image, by digest when published
    buildArg: PI_BASE
  pi:
    default: "1.3.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: Pi version the base image provides
    buildArg: PI_VERSION
  piAcp:
    default: "0.0.34"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: pi-acp version the base image provides
    buildArg: PI_ACP_VERSION
# marsh shows this in "pix updated (A → B)". kit_inputs.py stamps it into the
# prepared copy at publish time (the frontend does not expand args here).
version: "0.0.0-local"
provides: ["pi@${{ kit.args.pi }}", "pi-acp@${{ kit.args.piAcp }}"]
dockerfile: ./Dockerfile
capabilities:
  - type: com.docker.sandbox/sbx@1
  # ACP mode: the entrypoint's `--acp` (`acp run pix`, `marsh run --acp pix`).
  - type: com.docker.sandbox/acp@1
    config:
      agent: pix
      command: ["/usr/local/bin/marsh-pix", "--acp"]
  # Non-interactive prompt verbs: how marsh's task tool starts Pix.
  - type: com.docker.sandbox/agent-sessions@1
    config:
      prompt: ["-p", "{{.Prompt}}"]
  # marsh's model option for `task(model)` (`-p PROMPT --model M`).
  - type: org.marsh/agent-model@1
    optional: true
    config:
      args: ["--model", "{{.Model}}"]
      services: ["*"]   # multi-provider: any vendor whose key the host holds (`provider/model` ids)
  # marsh's usage option for the task tool: `-p PROMPT --mode json` prints
  # JSONL events (assistant `message_end` usage and cost, the last assistant
  # text as the final message), read with marsh's `pi-jsonl` parser.
  - type: org.marsh/agent-usage@1
    optional: true
    config:
      args: ["--mode", "json"]
      parser: pi-jsonl
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.anthropic.com:443
          - api.openai.com:443
          - generativelanguage.googleapis.com:443
          - api.mistral.ai:443
          - api.x.ai:443
          - registry.npmjs.org:443
          - pi.dev:443
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Anthropic native API
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.anthropic.com, header: x-api-key, format: "%s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenAI native API key (not ChatGPT OAuth)
    config:
      service: openai
      phase: runtime
      apiKey:
        name: OPENAI_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.openai.com, header: Authorization, format: "Bearer %s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Google Gemini native API
    config:
      service: google
      phase: runtime
      apiKey:
        name: GEMINI_API_KEY
        proxyManaged: true
        inject:
          - {domain: generativelanguage.googleapis.com, header: x-goog-api-key, format: "%s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Mistral API
    config:
      service: mistral
      phase: runtime
      apiKey:
        name: MISTRAL_API_KEY
        inject:
          - {domain: api.mistral.ai, header: Authorization, format: "Bearer %s"}
  - type: com.docker.sandbox/credential@1
    optional: true
    description: xAI API
    config:
      service: xai
      phase: runtime
      apiKey:
        name: XAI_API_KEY
        inject:
          - {domain: api.x.ai, header: Authorization, format: "Bearer %s"}
  # Skills a mixin adds (agent-skill@1), e.g. through a kit set; Pix loads
  # this folder when it exists. Independent of HOME, so marsh and stock SBX
  # both deliver here.
  - type: com.docker.sandbox/agent-skills@1
    config:
      path: /opt/pix/kit-skills
