[package]
name = "brush-interactive"
description = "Interactive layer of brush-shell"
version = "0.4.0"
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
# Application tier; see docs/reference/msrv-policy.md.
rust-version = "1.95.0"

[lib]
bench = false

[features]
default = []
basic = ["dep:crossterm", "completion"]
completion = []
minimal = []
reedline = ["dep:reedline", "dep:crossterm", "dep:libc", "dep:nu-ansi-term", "completion", "highlighting"]
highlighting = []

[lints]
workspace = true

[dependencies]
bon = "3.9.1"
brush-parser = { version = "^0.4.0", path = "../brush-parser" }
brush-core = { version = "^0.5.0", path = "../brush-core" }
crossterm = { version = "0.29.0", features = ["serde"], optional = true }
indexmap = "2.13.0"
nu-ansi-term = { version = "0.50.3", optional = true }
radix_trie = "0.3.0"
reedline = { version = "0.51.0", optional = true }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["io-std", "io-util", "rt", "sync"] }
tracing = "0.1.44"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.183", optional = true }
