name: Renovate
# Self-hosted Renovate (free, open source) that keeps every pin current: DHI and
# Rust base image digests, the Kits' agent CLIs and ACP adapters, npm and Cargo
# dependencies, and GitHub Actions. What it watches and how it groups updates is
# .github/renovate.json5; credentials and the one command it may run are
# .github/renovate-global.js. It opens PRs and merges each one itself once every
# check on it passes: CI (including the `images` job, which builds every image),
# Refresh pins, and the "License review" status. A red license review stops the
# merge for the owner. Renovate merges, not GitHub auto-merge, because "License
# review" is a Renovate-only status (see renovate.json5).
#
# It runs hourly and when CI succeeds on a renovate/** branch. CI prepares
# records before validation, so success means the completed head was checked.
# The hourly schedule is a backstop for delayed GitHub workflow events.
#
# Secrets:
#   RENOVATE_TOKEN          a token that can open PRs and update workflow files
#                           on this repository. A fine-grained PAT for this one
#                           repository with: Contents, Issues, Pull requests,
#                           Commit statuses and Workflows read/write, and
#                           Dependabot alerts read (docs.renovatebot.com/modules/
#                           platform/github). Or a GitHub App installation token.
#                           It must not be GITHUB_TOKEN: PRs it opens would not
#                           run CI.
#   DOCKERHUB_USERNAME      the Docker account (also used by release.yml)
#   DOCKERHUB_READ_TOKEN    a read-only access token for it, to look up
#                           dhi.io and docker.io digests. Not the publishing token.
#
# First run: Actions > Renovate > Run workflow with dry_run=full. The log lists
# the PRs it would open and opens none.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ['renovate/**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'full: log what would be opened and open nothing. none: open PRs.'
        type: choice
        options: [full, lookup, none]
        default: full
permissions:
  contents: read
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    # Only a successful validation run can lead to a merge.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dry run (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != 'none'
        run: echo "RENOVATE_DRY_RUN=${{ inputs.dry_run }}" >> "$GITHUB_ENV"
      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          configurationFile: .github/renovate-global.js
          token: ${{ secrets.RENOVATE_TOKEN }}
          additional-env-list: |
            DOCKER_HUB_USERNAME
            DOCKER_HUB_TOKEN
        env:
          LOG_LEVEL: info
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKERHUB_READ_TOKEN }}
