name: Site
# Build runmar.sh from docs/ and deploy it to GitHub Pages. In the repository's
# Pages settings, choose "GitHub Actions" as the source and set the custom
# domain to runmar.sh (the build also writes CNAME). DNS: apex A/AAAA records
# for GitHub Pages, or ALIAS to mcavage.github.io.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'scripts/sitegen.py'
      - 'scripts/check-links.py'
      - 'scripts/install.sh'
      - '.github/workflows/site.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and check links
        run: make site-check SITE_DIR=_site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
