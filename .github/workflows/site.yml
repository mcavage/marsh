name: Site
# Build runmar.sh from docs/ and deploy it to GitHub Pages. In the repository's
# Pages settings, choose "GitHub Actions" as the source and set the custom
# domain to runmar.sh (the build also writes CNAME). DNS: apex A/AAAA records
# for GitHub Pages, or ALIAS to mcavage.github.io.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'scripts/sitegen.py'
      - 'scripts/check-links.py'
      - 'scripts/install.sh'
      - '.github/workflows/site.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and check links
        run: make site-check SITE_DIR=_site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
