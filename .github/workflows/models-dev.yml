name: models.dev snapshot
# Refreshes crates/marsh-daemon/data/models-dev.json, the trimmed models.dev
# catalog marsh uses to class models its curated table does not name (peer
# review, docs/peer-review.md). marsh never fetches models.dev at run time.
# Weekly and by hand: regenerate with scripts/update-models-dev.py and, when it
# changed, open (or update) one pull request on the models-dev/snapshot
# branch. Normal CI tests it; it merges like any other PR.
#
# Secrets:
#   MODELS_DEV_TOKEN  a fine-grained PAT for this repository with only
#                     Contents and Pull requests read/write (not Workflows:
#                     this job only changes one data file). It must not be
#                     GITHUB_TOKEN, whose PRs would not run CI. Unset, the
#                     job regenerates the file and reports, opening no PR.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: models-dev
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.MODELS_DEV_TOKEN || github.token }}
      - name: Regenerate
        run: python3 scripts/update-models-dev.py
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.MODELS_DEV_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          file=crates/marsh-daemon/data/models-dev.json
          if git diff --quiet -- "$file"; then
            echo "models.dev snapshot unchanged" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "models.dev snapshot changed; set MODELS_DEV_TOKEN to open a pull request" | tee -a "$GITHUB_STEP_SUMMARY"
            git diff --stat -- "$file" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch=models-dev/snapshot
          git config user.name "marsh-bot"
          git config user.email "marsh-bot@users.noreply.github.com"
          git switch -C "$branch"
          git add "$file"
          git commit -m "Update models.dev snapshot ($(date -u +%Y-%m-%d))"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$branch" --base main --label dependencies \
              --title "Update models.dev snapshot" \
              --body "Regenerated by .github/workflows/models-dev.yml with scripts/update-models-dev.py. marsh classes models its curated table does not name by this snapshot's output prices (docs/peer-review.md)."
          fi
          git diff --stat HEAD~1 -- "$file" | tee -a "$GITHUB_STEP_SUMMARY"
