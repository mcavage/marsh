name: Kit marsh-tools
# Builds docker.io/mcavage/marsh-tools (kits/marsh-tools: gog and bamboohr in
# one Kit), which marsh follows at :stable. gog is pinned in the Kit's
# Dockerfile (version and checksum), so an upgrade is a reviewed change: bump
# the pin, classify the new commands and flags (tests/kits/tools-policy.py
# fails until every one is allowed or refused), and merge. Every change to the
# Kit (push to main) or a manual run builds the pinned gog and the bamboohr
# tool into the Kit, runs the offline smoke test, then pushes :VERSION
# (GOG-BAMBOOHR) and moves :stable. A failed build or smoke test never moves
# :stable. A pull request builds and smoke-tests the same way and pushes
# nothing. The separate marsh-gog and marsh-bamboohr images are no longer built.
on:
  pull_request:
    paths:
      - "kits/marsh-tools/**"
      - "tests/kits/tools-smoke.sh"
      - "tests/kits/tools-policy.py"
      - ".github/workflows/kit-tools.yml"
  push:
    branches: [main]
    paths:
      - "kits/marsh-tools/**"
      - "tests/kits/tools-smoke.sh"
      - "tests/kits/tools-policy.py"
      - ".github/workflows/kit-tools.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kit-tools-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  IMAGE: docker.io/mcavage/marsh-tools
jobs:
  publish:
    name: build, test and publish marsh-tools
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned gog release
        id: gog
        run: |
          set -eu
          version=$(sed -n 's/^ARG GOG_VERSION=//p' kits/marsh-tools/Dockerfile)
          sha=$(sed -n 's/^ARG GOG_SHA256=//p' kits/marsh-tools/Dockerfile)
          case "$version" in *[!0-9.]*|'') echo "bad GOG_VERSION in the Dockerfile: $version" >&2; exit 1;; esac
          case "$sha" in *[!0-9a-f]*|'') echo "bad GOG_SHA256 in the Dockerfile" >&2; exit 1;; esac
          # bamboohr's version changes only with its own code, so a rebuild
          # alone doesn't announce an update.
          bamboo=$(git log -1 --date=format:%Y.%m.%d --format=%cd-%h -- kits/marsh-tools/bamboohr)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "bamboo=$bamboo" >> "$GITHUB_OUTPUT"
          echo "tag=$version-$bamboo" >> "$GITHUB_OUTPUT"
          echo "gog $version ($sha), bamboohr $bamboo"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and smoke-test
        env:
          VERSION: ${{ steps.gog.outputs.version }}
          SHA: ${{ steps.gog.outputs.sha }}
          BAMBOO: ${{ steps.gog.outputs.bamboo }}
          TAG: ${{ steps.gog.outputs.tag }}
        run: |
          set -eu
          sed -i "s/^version: .*/version: \"$TAG\"/" kits/marsh-tools/kit.yaml
          sed -i "s/\"gogcli@[^\"]*\"/\"gogcli@$VERSION\"/" kits/marsh-tools/kit.yaml
          sed -i "s/\"bamboohr@[^\"]*\"/\"bamboohr@$BAMBOO\"/" kits/marsh-tools/kit.yaml
          docker buildx build --platform linux/arm64 --load -f kits/marsh-tools/kit.yaml \
            --build-arg "GOG_VERSION=$VERSION" --build-arg "GOG_SHA256=$SHA" -t marsh-tools:candidate kits/marsh-tools
          tests/kits/tools-smoke.sh marsh-tools:candidate
      - name: Publish
        if: github.event_name != 'pull_request'
        # Builds from the version-stamped descriptors of the previous step.
        env:
          VERSION: ${{ steps.gog.outputs.version }}
          SHA: ${{ steps.gog.outputs.sha }}
          TAG: ${{ steps.gog.outputs.tag }}
        run: |
          set -eu
          docker buildx build --platform linux/arm64 --push -f kits/marsh-tools/kit.yaml \
            --build-arg "GOG_VERSION=$VERSION" --build-arg "GOG_SHA256=$SHA" \
            -t "$IMAGE:$TAG" -t "$IMAGE:stable" kits/marsh-tools
