name: Kit marsh-tools
# Builds docker.io/mcavage/marsh-tools (kits/marsh-tools: gog and bamboohr in
# one Kit), which marsh follows at :stable. Follows gog's releases: every six
# hours, build the latest gog release and the bamboohr tool into the Kit, run
# the offline smoke test, then push :VERSION (GOG-BAMBOOHR) and move :stable.
# A failed build or smoke test never moves :stable. A change to the Kit (push
# to main) or a manual run republishes. A pull request builds and smoke-tests
# the same way and pushes nothing. The separate marsh-gog and marsh-bamboohr
# images are no longer built.
on:
  pull_request:
    paths:
      - "kits/marsh-tools/**"
      - "tests/kits/tools-smoke.sh"
      - ".github/workflows/kit-tools.yml"
  push:
    branches: [main]
    paths:
      - "kits/marsh-tools/**"
      - "tests/kits/tools-smoke.sh"
      - ".github/workflows/kit-tools.yml"
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kit-tools-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  IMAGE: docker.io/mcavage/marsh-tools
jobs:
  publish:
    name: build, test and publish marsh-tools
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Latest gog release
        id: gog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=$(gh api repos/steipete/gogcli/releases/latest -q .tag_name)
          version=${tag#v}
          case "$version" in *[!0-9.]*|'') echo "unexpected gog tag $tag" >&2; exit 1;; esac
          gh release download "$tag" -R steipete/gogcli -p checksums.txt -O checksums.txt
          sha=$(awk -v f="gogcli_${version}_linux_arm64.tar.gz" '$2==f {print $1}' checksums.txt)
          case "$sha" in *[!0-9a-f]*|'') echo "no linux arm64 checksum for $tag" >&2; exit 1;; esac
          # bamboohr's version changes only with its own code, so a rebuild
          # alone doesn't announce an update.
          bamboo=$(git log -1 --date=format:%Y.%m.%d --format=%cd-%h -- kits/marsh-tools/bamboohr)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "bamboo=$bamboo" >> "$GITHUB_OUTPUT"
          echo "tag=$version-$bamboo" >> "$GITHUB_OUTPUT"
          echo "gog $version ($sha), bamboohr $bamboo"
      - name: Already published?
        id: check
        env:
          TAG: ${{ steps.gog.outputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] && docker buildx imagetools inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "marsh-tools $TAG is already published"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.check.outputs.skip == 'false'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.check.outputs.skip == 'false' && github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and smoke-test
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.gog.outputs.version }}
          SHA: ${{ steps.gog.outputs.sha }}
          BAMBOO: ${{ steps.gog.outputs.bamboo }}
          TAG: ${{ steps.gog.outputs.tag }}
        run: |
          set -eu
          sed -i "s/^version: .*/version: \"$TAG\"/" kits/marsh-tools/kit.yaml
          sed -i "s/\"gogcli@[^\"]*\"/\"gogcli@$VERSION\"/" kits/marsh-tools/kit.yaml
          sed -i "s/\"bamboohr@[^\"]*\"/\"bamboohr@$BAMBOO\"/" kits/marsh-tools/kit.yaml
          docker buildx build --platform linux/arm64 --load -f kits/marsh-tools/kit.yaml \
            --build-arg "GOG_VERSION=$VERSION" --build-arg "GOG_SHA256=$SHA" -t marsh-tools:candidate kits/marsh-tools
          tests/kits/tools-smoke.sh marsh-tools:candidate
      - name: Publish
        if: steps.check.outputs.skip == 'false' && github.event_name != 'pull_request'
        # Builds from the version-stamped descriptors of the previous step.
        env:
          VERSION: ${{ steps.gog.outputs.version }}
          SHA: ${{ steps.gog.outputs.sha }}
          TAG: ${{ steps.gog.outputs.tag }}
        run: |
          set -eu
          docker buildx build --platform linux/arm64 --push -f kits/marsh-tools/kit.yaml \
            --build-arg "GOG_VERSION=$VERSION" --build-arg "GOG_SHA256=$SHA" \
            -t "$IMAGE:$TAG" -t "$IMAGE:stable" kits/marsh-tools
