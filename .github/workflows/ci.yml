name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels a superseded pull request run. Runs on main finish: a
  # cancelled run cannot be the "CI passed" that release.yml waits for, and
  # frequent merges would otherwise keep cancelling a cold TLA+ sweep.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

# What CI checks: `make test` (formatting, lints, every workspace test, the
# Python and shell harnesses, the TLA+ model) on Linux and macOS, and docs
# links. A pull request runs only the lanes its files need (scripts/ci-changes.sh):
# a docs-only change runs the docs check alone, and the macOS host tests run
# when host code, tests or the build changed. A merge to main runs every lane,
# including the full TLA+ sweep. The macOS release build is not here: the
# nightly and release workflows build it (release.yml).
# What it does not: start microVMs. GitHub's macOS arm64 runners are VMs
# without nested virtualization and its Linux arm64 runners have no KVM; Linux
# x64 has KVM, but the guests are linux/arm64 and the host needs APFS file IDs
# (crates/marsh-host-identity). So the stock-SBX gate (make verify / regress /
# acceptance) runs on a Mac by hand; see CONTRIBUTING.md.
jobs:
  changes:
    # Which lanes a pull request needs. A merge or manual run needs them all.
    # The lanes below run when this job fails, so a broken classifier can only
    # cost time, never skip a check.
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      host: ${{ steps.classify.outputs.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify the changed files
        id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            printf 'code=true\nhost=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --name-only "origin/$BASE_REF...HEAD" | sh scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  linux:
    name: Linux arm64 (shell, guest crates, protocols)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Compiler cache (content-addressed, reusable across source changes)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      # Bash is the differential-test oracle, and the oracle is GNU Bash 5.3
      # (docs/design/bash-compatibility.md); Ubuntu 24.04 ships 5.2.
      - name: GNU Bash 5.3 (test oracle)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bash-5.3.tar.gz" https://ftp.gnu.org/gnu/bash/bash-5.3.tar.gz
          echo "0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba  $RUNNER_TEMP/bash-5.3.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/bash-5.3.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/bash-5.3"
          ./configure --quiet --prefix="$RUNNER_TEMP/bash"
          make -s -j"$(nproc)"
          make -s install
          # shellcheck disable=SC2016 # expanded by the new bash
          "$RUNNER_TEMP/bash/bin/bash" -c '[ "${BASH_VERSINFO[0]}${BASH_VERSINFO[1]}" -ge 53 ]'
          echo "$RUNNER_TEMP/bash/bin" >> "$GITHUB_PATH"
      - name: cargo-nextest
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL -o "$RUNNER_TEMP/nextest.tgz" https://get.nexte.st/0.9.148/linux-arm
          echo "81469eb963ef883fd590e60189e77d6aba3d91b418591d3391f50fe3e9480d2b  $RUNNER_TEMP/nextest.tgz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/nextest.tgz" -C "$HOME/.cargo/bin"
      # Cargo sources can cross source changes; target output cannot. sccache
      # separately reuses compiler results by their actual compilation inputs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-linux-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-linux-${{ runner.arch }}-rust1.99-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**', 'vendor/**', 'tests/**') }}
      - name: Tool versions
        run: |
          cargo --version
          python3 --version
          node --version
          bash --version | head -1
      # The same targets as a local `make test` (Makefile): every workspace
      # test, then the Python and shell harnesses. The model has its own job.
      - name: make test-rust (fmt, clippy, every workspace test, MCP load callers)
        run: make test-rust NEXTEST_PROFILE=ci
      - name: make test-harness (onboarding, MCP callers, publisher, tool self-tests)
        run: make test-harness
      # The Bash differential suites' per-case observations, to diagnose a mismatch.
      - name: Bash suite evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bash-suites-evidence
          path: target/bash-suites
          if-no-files-found: ignore

  macos:
    name: macOS arm64 (host build and tests)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.host == 'true') }}
    runs-on: macos-14
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Compiler cache (content-addressed, reusable across source changes)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      # The differential-test oracle is GNU Bash 5.3; the runner has only
      # /bin/bash 3.2.
      - name: GNU Bash 5.3 (test oracle)
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install bash
          # shellcheck disable=SC2016 # expanded by the new bash
          "$(brew --prefix)/bin/bash" -c '[ "${BASH_VERSINFO[0]}${BASH_VERSINFO[1]}" -ge 53 ]'
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix)/bin/bash" --version | head -1
      # Registry sources are content-addressed by Cargo.lock, so they may be
      # restored across source changes; build output is not (exact source key).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-macos-${{ hashFiles('Cargo.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-macos-${{ runner.arch }}-rust1.99-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**', 'vendor/**', 'tests/**') }}
      - name: Tool versions
        run: |
          cargo --version
          python3 --version
          /usr/bin/python3 --version
          node --version
          bash --version | head -1
          sysctl -n hw.ncpu
      - name: cargo-nextest
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL -o "$RUNNER_TEMP/nextest.tgz" https://get.nexte.st/0.9.148/mac
          echo "6c23b7fb4ca82c571fc8dfedbab45bfa773d45918f933170c85d21cd7f4b852b  $RUNNER_TEMP/nextest.tgz" | shasum -a 256 -c
          tar -xzf "$RUNNER_TEMP/nextest.tgz" -C "$HOME/.cargo/bin"
      # Host tests use fake sbx executables and temporary homes; none needs
      # Docker Sandboxes or credentials.
      - name: make test-rust (fmt, clippy, every workspace test, MCP load callers)
        run: make test-rust NEXTEST_PROFILE=ci
      - name: make test-harness (onboarding, MCP callers, publisher, tool self-tests)
        run: make test-harness

  docs:
    name: Docs and site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mandoc
        run: sudo apt-get update -q && sudo apt-get install -y -q mandoc
      - name: Man page (lint clean)
        run: make man
      - name: Site and every Markdown link
        run: make site-check
      # The one test that reads docs/. A docs-only pull request skips the
      # harness that otherwise runs it.
      - name: Guides reach the site navigation and the manual
        run: python3 tests/release/test_site.py

  model:
    # Workspace_depth3_pass alone runs ~30 min, so the config marked `huge` is
    # its own shard and the rest share one; inside a shard check.sh runs configs
    # concurrently (docs/model/check.sh --help). On a pull request both shards
    # check only when a model input changed (docs/model, the pinned TLA+ tools,
    # the model target or this job); otherwise they pass at once. A merge to main
    # checks every config. The verdict cache is keyed by the model files, so an
    # unchanged model is quick; the first run after a model change on main is
    # cold (the pull request's cache is not visible there) and takes ~30 min.
    name: TLA+ model (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [depth3, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did a model input change?
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          range="origin/$BASE_REF...HEAD"
          if git diff --name-only "$range" | grep -q '^docs/model/' ||
             git diff -U0 "$range" -- Makefile .github/workflows/ci.yml | grep -Ev '^(\+\+\+|---) ' |
               grep -Eq '^[-+].*(TLA2TOOLS|tla2tools|test-model|MODEL_FLAGS|MODEL_CACHE|setup-java|tlc-)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No model input changed; nothing to check."
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Verdict cache
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tlc-cache
          key: tlc-${{ matrix.shard }}-java21-${{ hashFiles('docs/model/**') }}
      - name: Check every config (positive configs pass, negative controls fail as expected)
        if: steps.changes.outputs.run == 'true'
        env:
          TLC_RUNNER: java
          TLC_CACHE: ${{ runner.temp }}/tlc-cache
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$SHARD" = depth3 ]; then flag=--huge; else flag=--no-huge; fi
          make test-model MODEL_FLAGS="$flag" MODEL_CACHE="$TLC_CACHE"

  images:
    # Builds the shell template and every Kit from their pinned inputs, without
    # pushing (make kits, prepare-shell-image --validate-only). This is where a
    # base-image or agent-CLI bump (Renovate) proves it still builds: the build
    # verifies the downloaded checksums and the license notices. It runs only
    # when an input changed, and not for fork PRs (no registry secrets there).
    name: Kit and shell images (build, no push)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did an image input change?
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then range="origin/$BASE_REF...HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE...HEAD"
          else echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          inputs='^(kits/marsh-(claude|codex|pi|shell)/|packaging/(shell|shell-image|commands\.json|agents\.json|image-base|image-repair|dhi-notices|notice-overrides)|tests/acceptance/[a-z-]*fixture/|scripts/(publish-kits|prepare-shell-image|prepare-kit-inputs|build_inputs|image_observations|stage-kits|owned_process|stock_sdk)\.py|scripts/requirements-publish\.txt|Makefile$|\.github/workflows/ci\.yml$)'
          if git diff --name-only "$range" | grep -Eq "$inputs"; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "No image input changed; nothing to build."; fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.changes.outputs.run == 'true'
      - name: Log in to Docker Hub and Docker Hardened Images
        if: steps.changes.outputs.run == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for registry in docker.io dhi.io; do
            printf '%s' "$DOCKERHUB_TOKEN" | docker login "$registry" --username "$DOCKERHUB_USERNAME" --password-stdin
          done
      - name: Publisher dependencies
        if: steps.changes.outputs.run == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --no-deps --only-binary=:all: -r scripts/requirements-publish.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Shell VM template
        if: steps.changes.outputs.run == 'true'
        run: python3 scripts/prepare-shell-image.py --validate-only
      - name: Kits and the acceptance fixture
        if: steps.changes.outputs.run == 'true'
        run: make kits TARGET_DIR="$RUNNER_TEMP/target"

  renovate-config:
    name: Renovate config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did the config change?
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ] &&
             ! git diff --name-only "origin/$BASE_REF...HEAD" | grep -Eq '^\.github/(renovate|workflows/ci\.yml$)'; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Renovate config unchanged."
          else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: '24'
      - name: Validate the repository and global configs
        if: steps.changes.outputs.run == 'true'
        # Pin the actual validator, not a moving major that can select a
        # just-published/unavailable tarball. This version meets the local
        # three-day npm release-age policy and requires Node 24.
        run: |
          npx --yes --package renovate@44.150.1 renovate-config-validator --strict
          RENOVATE_CONFIG_FILE=.github/renovate-global.js npx --yes --package renovate@44.150.1 renovate-config-validator --strict
