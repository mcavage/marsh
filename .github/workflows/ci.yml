name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # release.yml runs every lane on the commit it is about to build.
  workflow_call:
    inputs:
      all:
        description: Run every lane, whatever changed.
        type: boolean
        default: false
      ref:
        description: The commit to check out in every job (default the caller's).
        type: string
        default: ''
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
permissions:
  contents: read
# Every commit on main gets its own run: GitHub keeps one pending run per
# group, so a shared group would drop the in-between commits. A newer push
# cancels a superseded pull request run. A call from release.yml sees the
# caller's github context (its sha can be the same commit's push run), so it
# takes a group of its own per release run: it never queues behind, or
# replaces, the push run. The huge TLA+ configs run in model.yml, never in
# this group.
concurrency:
  group: ci-${{ inputs.ref && format('release-{0}', github.run_id) || (github.event_name == 'pull_request' && github.ref || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

# What CI checks: `make test` (formatting, lints, every workspace test, the
# Python and shell harnesses, the TLA+ model), split into parallel jobs, and
# docs links. Linux arm64 runs all of it. macOS runs clippy and the host side:
# on a pull request the workspace tests except the platform-neutral guest
# worker, contract values, Bash audit and API probe (Makefile TEST_SCOPE=host),
# split between two jobs, the binary
# callers and the entrypoint harnesses. PRs and main pushes run only the
# lanes their files need (scripts/ci-changes.sh): a docs-only
# change runs the docs check alone. "CI passed" is the one required check.
# Manual runs, and release.yml's call (all: true) on the commit it builds,
# run every lane.
# The huge TLA+ configs run weekly (model.yml) and in make regress. The macOS release build is not
# here: the nightly and release workflows build it (release.yml).
# What it does not: start microVMs. GitHub's macOS arm64 runners are VMs
# without nested virtualization and its Linux arm64 runners have no KVM; Linux
# x64 has KVM, but the guests are linux/arm64 and the host needs APFS file IDs
# (crates/marsh-host-identity). So the stock-SBX gate (make verify / regress /
# acceptance) runs on a Mac by hand; see CONTRIBUTING.md.
jobs:
  changes:
    # Classify PRs against main and pushes against their previous revision.
    # Manual runs and missing history check everything. If this job fails,
    # every lane runs so a broken classifier cannot skip a check.
    name: What changed
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      host: ${{ steps.classify.outputs.host }}
      tools: ${{ steps.classify.outputs.tools }}
      model: ${{ steps.classify.outputs.model }}
      images: ${{ steps.classify.outputs.images }}
      renovate: ${{ steps.classify.outputs.renovate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Classify the changed files
        id: classify
        env:
          ALL: ${{ inputs.all }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$ALL" = true ]; then
            # A release (workflow_call with all): check everything.
            sh scripts/ci-changes.sh </dev/null | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only "origin/$BASE_REF...HEAD" | sh scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD | sh scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          else
            # Manual dispatch or missing history: check everything.
            sh scripts/ci-changes.sh </dev/null | tee -a "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint (fmt, clippy; Linux)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Compiler cache (content-addressed, reusable across source changes)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      # Built dependencies and the registry, restored from main's last run
      # (a pull request only restores). Workspace crates always rebuild;
      # sccache supplies the unchanged ones.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: 'false'
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: make lint
        run: make lint

  linux-unit:
    name: Linux arm64 (workspace tests)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Compiler cache (content-addressed, reusable across source changes)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      # Bash is the differential-test oracle, and the oracle is GNU Bash 5.3
      # (docs/design/bash-compatibility.md); Ubuntu ships an older one. Built
      # once from the checked tarball and cached by its checksum.
      - id: bash-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/gnu-bash
          key: gnu-bash-5.3-${{ runner.os }}-${{ runner.arch }}-0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba
      - name: GNU Bash 5.3 (test oracle)
        env:
          CACHED: ${{ steps.bash-cache.outputs.cache-hit }}
        run: |
          prefix="$HOME/.local/gnu-bash"
          if [ "$CACHED" != true ]; then
            curl -fsSL -o "$RUNNER_TEMP/bash-5.3.tar.gz" https://ftp.gnu.org/gnu/bash/bash-5.3.tar.gz
            echo "0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba  $RUNNER_TEMP/bash-5.3.tar.gz" | sha256sum -c
            tar -xzf "$RUNNER_TEMP/bash-5.3.tar.gz" -C "$RUNNER_TEMP"
            (cd "$RUNNER_TEMP/bash-5.3" && ./configure --quiet --prefix="$prefix" && make -s -j"$(nproc)" && make -s install)
          fi
          # shellcheck disable=SC2016 # expanded by the new bash
          "$prefix/bin/bash" -c '[ "${BASH_VERSINFO[0]}${BASH_VERSINFO[1]}" -ge 53 ]'
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: cargo-nextest
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL -o "$RUNNER_TEMP/nextest.tgz" https://get.nexte.st/0.9.148/linux-arm
          echo "81469eb963ef883fd590e60189e77d6aba3d91b418591d3391f50fe3e9480d2b  $RUNNER_TEMP/nextest.tgz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/nextest.tgz" -C "$HOME/.cargo/bin"
      # Built dependencies and the registry, restored from main's last run
      # (a pull request only restores). Workspace crates always rebuild;
      # sccache supplies the unchanged ones.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: 'false'
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Tool versions
        run: |
          cargo --version
          python3 --version
          node --version
          bash --version | head -1
      - name: make test-unit (every workspace test, doctests)
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        run: make test-unit NEXTEST_PROFILE=ci

  linux-callers:
    name: Linux arm64 (binary callers, entrypoints)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Compiler cache (content-addressed, reusable across source changes)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - name: cargo-nextest
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL -o "$RUNNER_TEMP/nextest.tgz" https://get.nexte.st/0.9.148/linux-arm
          echo "81469eb963ef883fd590e60189e77d6aba3d91b418591d3391f50fe3e9480d2b  $RUNNER_TEMP/nextest.tgz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/nextest.tgz" -C "$HOME/.cargo/bin"
      # Built dependencies and the registry, restored from main's last run
      # (a pull request only restores). Workspace crates always rebuild;
      # sccache supplies the unchanged ones.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: 'false'
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: make test-callers (MCP load and ACP callers)
        run: make test-callers NEXTEST_PROFILE=ci
      - name: make test-entrypoints (onboarding, MCP protocol callers)
        run: make test-entrypoints

  linux-bash:
    name: Linux arm64 (Bash differential suites)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Compiler cache (content-addressed, reusable across source changes)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - id: bash-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/gnu-bash
          key: gnu-bash-5.3-${{ runner.os }}-${{ runner.arch }}-0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba
      - name: GNU Bash 5.3 (test oracle)
        env:
          CACHED: ${{ steps.bash-cache.outputs.cache-hit }}
        run: |
          prefix="$HOME/.local/gnu-bash"
          if [ "$CACHED" != true ]; then
            curl -fsSL -o "$RUNNER_TEMP/bash-5.3.tar.gz" https://ftp.gnu.org/gnu/bash/bash-5.3.tar.gz
            echo "0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba  $RUNNER_TEMP/bash-5.3.tar.gz" | sha256sum -c
            tar -xzf "$RUNNER_TEMP/bash-5.3.tar.gz" -C "$RUNNER_TEMP"
            (cd "$RUNNER_TEMP/bash-5.3" && ./configure --quiet --prefix="$prefix" && make -s -j"$(nproc)" && make -s install)
          fi
          # shellcheck disable=SC2016 # expanded by the new bash
          "$prefix/bin/bash" -c '[ "${BASH_VERSINFO[0]}${BASH_VERSINFO[1]}" -ge 53 ]'
          echo "$prefix/bin" >> "$GITHUB_PATH"
      # Built dependencies and the registry, restored from main's last run
      # (a pull request only restores). Workspace crates always rebuild;
      # sccache supplies the unchanged ones.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: 'false'
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: make test-bash (Bash differential suites)
        run: make test-bash
      # The Bash differential suites' per-case observations, to diagnose a mismatch.
      - name: Bash suite evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bash-suites-evidence
          path: target/bash-suites
          if-no-files-found: ignore

  tools:
    # The publisher and tooling self-tests are Python and shell: no Rust build.
    name: Tooling and publisher (Linux)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tools == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # The publisher venv gets an interpreter its pinned PyYAML has wheels
      # for, leaving the runner's python3 alone.
      - id: publisher-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          update-environment: false
      - name: make test-tools (publisher, tool self-tests)
        run: make test-tools HARNESS_JOBS="$(nproc)" PUBLISHER_PYTHON="${{ steps.publisher-python.outputs.python-path }}"

  macos-unit:
    # clippy sees the cfg(target_os = "macos") code only here. Hosted macOS
    # runners are scarce, so clippy shares this job rather than taking a third.
    name: macOS arm64 (clippy, host workspace tests)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.host == 'true') }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Compiler cache (content-addressed, reusable across source changes)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      # The differential-test oracle is GNU Bash 5.3; the runner has only
      # /bin/bash 3.2.
      - name: GNU Bash 5.3 (test oracle)
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install bash
          # shellcheck disable=SC2016 # expanded by the new bash
          "$(brew --prefix)/bin/bash" -c '[ "${BASH_VERSINFO[0]}${BASH_VERSINFO[1]}" -ge 53 ]'
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: cargo-nextest
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL -o "$RUNNER_TEMP/nextest.tgz" https://get.nexte.st/0.9.148/mac
          echo "6c23b7fb4ca82c571fc8dfedbab45bfa773d45918f933170c85d21cd7f4b852b  $RUNNER_TEMP/nextest.tgz" | shasum -a 256 -c
          tar -xzf "$RUNNER_TEMP/nextest.tgz" -C "$HOME/.cargo/bin"
      # Built dependencies and the registry, restored from main's last run
      # (a pull request only restores). Workspace crates always rebuild;
      # sccache supplies the unchanged ones.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: 'false'
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Tool versions
        run: |
          cargo --version
          python3 --version
          /usr/bin/python3 --version
          node --version
          bash --version | head -1
          sysctl -n hw.ncpu
      - name: make lint
        run: make lint
      # Host tests use fake sbx executables and temporary homes; none needs
      # Docker Sandboxes or credentials. A pull request skips the
      # platform-neutral crates Linux runs (Makefile TEST_SCOPE). marsh-mcp
      # and marsh-acp run in macos-callers, which builds their tests anyway.
      - name: make test-unit (host workspace tests but marsh-mcp and marsh-acp, doctests)
        env:
          TEST_SCOPE: ${{ github.event_name == 'pull_request' && 'host' || 'all' }}
        run: make test-unit NEXTEST_PROFILE=ci TEST_SCOPE="$TEST_SCOPE" TEST_EXCLUDE="marsh-mcp marsh-acp"

  macos-callers:
    name: macOS arm64 (MCP and ACP tests, binary callers, entrypoints)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.host == 'true') }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Compiler cache (content-addressed, reusable across source changes)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - name: GNU Bash 5.3 (test oracle)
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: cargo-nextest
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL -o "$RUNNER_TEMP/nextest.tgz" https://get.nexte.st/0.9.148/mac
          echo "6c23b7fb4ca82c571fc8dfedbab45bfa773d45918f933170c85d21cd7f4b852b  $RUNNER_TEMP/nextest.tgz" | shasum -a 256 -c
          tar -xzf "$RUNNER_TEMP/nextest.tgz" -C "$HOME/.cargo/bin"
      # Built dependencies and the registry, restored from main's last run
      # (a pull request only restores). Workspace crates always rebuild;
      # sccache supplies the unchanged ones.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: 'false'
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: make test-unit (marsh-mcp and marsh-acp workspace tests, doctests)
        env:
          TEST_SCOPE: ${{ github.event_name == 'pull_request' && 'host' || 'all' }}
        run: make test-unit NEXTEST_PROFILE=ci TEST_SCOPE="$TEST_SCOPE" TEST_PACKAGES="marsh-mcp marsh-acp"
      - name: make test-callers (MCP load and ACP callers)
        run: make test-callers NEXTEST_PROFILE=ci
      - name: make test-entrypoints (onboarding, MCP protocol callers)
        run: make test-entrypoints
      # On main, the tooling self-tests run on macOS too: make regress and
      # its harness run on a Mac.
      - id: publisher-python
        if: github.event_name != 'pull_request'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          update-environment: false
      - name: make test-tools (publisher, tool self-tests)
        if: github.event_name != 'pull_request'
        run: make test-tools PUBLISHER_PYTHON="${{ steps.publisher-python.outputs.python-path }}"

  docs:
    name: Docs and site
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Install mandoc
        run: sudo apt-get update -q && sudo apt-get install -y -q mandoc
      - name: Man page (lint clean)
        run: make man
      - name: Site and every Markdown link
        run: make site-check
      # The one test that reads docs/. A docs-only pull request skips the
      # harness that otherwise runs it.
      - name: Guides reach the site navigation and the manual
        run: python3 tests/release/test_site.py

  model:
    # Every config except the huge ones (those run weekly in model.yml);
    # check.sh runs them concurrently (docs/model/check.sh --help). The verdict
    # cache is keyed by the model files, so an unchanged model is quick.
    name: TLA+ model
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.model == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verdict cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tlc-cache
          key: tlc-rest-java21-${{ hashFiles('docs/model/**') }}
          # check.sh separately hashes each spec/config, tools jar and runner.
          # Reuse unchanged verdicts when only another model or its docs moved.
          restore-keys: tlc-rest-java21-
      - name: Check every config but the huge ones (positive configs pass, negative controls fail as expected)
        env:
          TLC_RUNNER: java
          # /tmp can be quota-limited; TLC's disk-backed queue needs the
          # runner workspace filesystem for large state spaces.
          TMPDIR: ${{ runner.temp }}
          TLC_CACHE: ${{ runner.temp }}/tlc-cache
        run: make test-model MODEL_FLAGS=--no-huge MODEL_CACHE="$TLC_CACHE"

  images:
    # Builds the shell template, the services engine image and every Kit from
    # their pinned inputs, without pushing (make kits, prepare-shell-image
    # --validate-only, and the engine as a local OCI tar, the release's own
    # step). This is where a base-image, apt-pin or agent-CLI bump (Renovate)
    # proves it still builds and the installed commands pass their smoke
    # checks. It runs only when an input changed, and not for fork PRs (no
    # registry secrets there: the DHI base and the Kits' bases need a login).
    name: Kit and shell images (build, no push)
    needs: changes
    if: >-
      !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.images == 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub and Docker Hardened Images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for registry in docker.io dhi.io; do
            printf '%s' "$DOCKERHUB_TOKEN" | docker login "$registry" --username "$DOCKERHUB_USERNAME" --password-stdin
          done
      - name: Publisher dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --no-deps --only-binary=:all: -r scripts/requirements-publish.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Shell VM template
        run: python3 scripts/prepare-shell-image.py --validate-only
      - name: Services engine image
        run: python3 scripts/prepare-svc-engine-image.py --docker docker --output "$RUNNER_TEMP/svc-engine"
      - name: Kits and the acceptance fixture
        run: make kits TARGET_DIR="$RUNNER_TEMP/target"

  renovate-config:
    name: Renovate config
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.renovate == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate the repository and global configs
        # Use the bot's exact engine version, never a floating major. Renovate
        # updates the shared pin after the normal release-age observation.
        run: |
          version=$(cat .github/renovate-version)
          npx --yes --package "renovate@$version" renovate-config-validator --strict
          RENOVATE_CONFIG_FILE=.github/renovate-global.js npx --yes --package "renovate@$version" renovate-config-validator --strict
          npx --yes --package "renovate@$version" --call 'node tests/release/renovate-policy.mjs "$(command -v renovate-config-validator)"'

  passed:
    # The one required status check: every lane above passed or was not
    # needed. A skipped lane is fine; a failed or cancelled one is not. (When
    # the classifier fails, every lane runs, so its own result is not counted.)
    # When release.yml asks for every lane, a skipped lane fails too.
    name: CI passed
    needs: [lint, linux-unit, linux-callers, linux-bash, tools, macos-unit, macos-callers, docs, model, images, renovate-config]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every lane passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          ALL: ${{ inputs.all }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case $result in
              success) ;;
              skipped) [ "$ALL" != true ] || { echo "::error::a lane was skipped in a run of every lane"; exit 1; } ;;
              *) echo "::error::a lane ended $result"; exit 1;;
            esac
          done
