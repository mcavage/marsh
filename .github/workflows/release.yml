name: Release
# One pipeline, two channels. The version is never hand-edited: it is stamped
# into the build (scripts/stamp-version.py) and never committed. It runs on
# three triggers: a tag (stable), a daily schedule (nightly), and every passing
# CI run on main (the Kit images only).
#
# Before a stable, nightly or draft build builds anything, the ci job runs
# every CI lane (ci.yml, the jobs `make test` is split into) on the exact
# commit it is about to build, whatever that commit changed. Nothing is built
# or published unless that run passes.
#
#   stable   push a tag vX.Y.Z on a commit on main. Version = the tag.
#            Publishes the GitHub Release,
#            Docker Hub images (:X.Y.Z, :latest, :release) and the Homebrew
#            formula `marsh`.
#   nightly  once a day (08:00 UTC: midnight PST, 1am PDT), from the newest
#            commit on main whose CI run passed, and only if main has moved
#            since the last nightly. Version =
#            <next patch>-nightly.<commit UTC time>.g<sha>, e.g.
#            0.1.3-nightly.20261009171916.gb1f7e8b. Publishes a GitHub
#            prerelease (the newest 10 are kept), Docker Hub images (:nightly
#            and :<version>; prune-nightlies.yml trims them the same way) and
#            the Homebrew formula `marsh-nightly`. A manual run on main without
#            a version publishes a nightly from main's tip any time.
#   per commit  image-input changes on main whose CI passed run only the version
#            and images stages: the Kit images are built, :nightly moves, and
#            the stable Kit tag may move (below). No version tags are made, so
#            the 10 kept nightly image tags stay the daily builds. The guest,
#            host, release and tap stages (the macOS build and the Homebrew
#            nightly) do not run.
#   manual   workflow_dispatch, on main only. With a version it rehearses a
#            stable release: everything up to the host build, with the
#            tarball and formula kept as the run's dist artifact. Its images
#            get only the moving tag :draft, and it makes no GitHub Release
#            (not even a draft one, which anyone could publish from the UI).
#            Without a version it publishes a nightly from main's tip.
#
# Kit images move to stable without a marsh release. Stable marsh follows each
# packaged Kit's :latest tag (automatic updates at each daemon start and
# daily). After every per-commit run from a main CI run that passed, the images
# job also moves :latest of each packaged Kit image (claude, codex, pi, shell)
# to this build, when and only when:
#   * that CI run ran and passed every Rust lane on this commit (a push run
#     selects lanes from its own diff; the Rust tests check the Kits'
#     contract). Otherwise :nightly still moves and :latest stays;
#   * the image's org.marsh.kit.contract label is in the range that the newest
#     stable marsh release supports (SUPPORTED_KIT_CONTRACTS in that tag's
#     crates/marsh-contracts/src/kit_source.rs), so a stable user is never
#     offered an image that needs a newer marsh (marsh checks the label again
#     before it switches); and
#   * it was built from different Kit inputs than :latest (the
#     org.marsh.kit.inputs annotation publish-kits.py adds: a hash of the
#     staged Kit directory and build arguments), so a change to a Kit's scripts
#     moves it even when its descriptor (agent, adapter, package versions) is
#     unchanged, while a rebuild with nothing new does not hand every user a
#     new digest. An image without the annotation falls back to comparing
#     descriptors; a :latest without it counts as different.
# scripts/promote-stable-kits.py makes that decision. A stable tag still moves
# :latest to the release's own images. :nightly behaves as before.
#
# Stages: version, guest (Linux arm64 binaries), images (shell template and Kit
# images to docker.io/mcavage/marsh-*, digests recorded), host (macOS binaries;
# digests pinned into commands.json and shell-image; tarball + checksum),
# release (GitHub Release), tap (mcavage/homebrew-tap).
#
# Secrets:
#   DOCKERHUB_USERNAME,       Docker account that can push docker.io/mcavage/*
#   DOCKERHUB_TOKEN           and pull dhi.io base images (one login for both)
#   HOMEBREW_TAP_TOKEN        token with contents:write on mcavage/homebrew-tap
#                             (optional; the tap job is skipped without it)
# New Docker Hub repositories may default to private: make each public once.
on:
  push:
    tags: ['v*.*.*']
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'X.Y.Z: rehearse a stable release (dist artifact, no GitHub Release). Empty: publish a nightly from main. Main only.'
        required: false
permissions:
  contents: read
# Stable tags share one queue, so stable releases run one at a time. queue:
# max keeps up to 100 pending runs (the default keeps one and cancels the
# older pending run, which would silently drop a tag). GitHub does not
# promise the queue runs them in push order, and a failed job can be re-run
# after a newer release finished, so the order is not what keeps :latest,
# :release, :repaired, the GitHub "Latest" mark and the formula on the newest
# version: each job that moves them checks the repository's tags when it
# runs (scripts/newest-release.sh), and the tap job also refuses to write a
# version lower than the tap's. Rehearsals and nightlies have their own
# queues. Per-commit runs classify independently, so an unrelated commit
# cannot replace a pending image publication. Only their selected image jobs
# share a queue (below).
concurrency:
  group: release-${{ github.event_name == 'push' && 'stable' || github.event.inputs.version && 'rehearsal' || github.event_name == 'workflow_run' && format('commit-{0}', github.run_id) || 'nightly' }}
  cancel-in-progress: false
  queue: max
env:
  KIT_REPOSITORY_PREFIX: docker.io/mcavage
  SHELL_IMAGE_REPOSITORY: docker.io/mcavage/marsh-shell-template
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    outputs:
      stages: ${{ steps.v.outputs.stages }}
      channel: ${{ steps.v.outputs.channel }}
      version: ${{ steps.v.outputs.version }}
      draft: ${{ steps.v.outputs.draft }}
      sha: ${{ steps.v.outputs.sha }}
      formula: ${{ steps.v.outputs.formula }}
      image_tag: ${{ steps.v.outputs.image_tag }}
      extra_tags: ${{ steps.v.outputs.extra_tags }}
      promote_kits: ${{ steps.v.outputs.promote_kits }}
      stable_contracts: ${{ steps.v.outputs.stable_contracts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: v
        env:
          INPUT: ${{ github.event.inputs.version }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          promote_kits=false; stable_contracts=
          # all: every stage. images: the Kit images only (a per-commit run).
          # none: nothing to publish.
          stages=all
          # The CI jobs that run the Rust tests, by name (ci.yml). A push run
          # selects lanes from its own diff, so it may have skipped them.
          rust_lanes=$'Lint (fmt, clippy; Linux)\nLinux arm64 (workspace tests)\nLinux arm64 (binary callers, entrypoints)\nLinux arm64 (Bash differential suites)\nmacOS arm64 (clippy, host workspace tests)\nmacOS arm64 (MCP and ACP tests, binary callers, entrypoints)'
          rust_lanes_passed=false
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            # Follow CI's image selection, including its conservative fallback.
            # Unrelated commits must not rebuild or publish the Kit images.
            # The attempt that completed, not a re-run started since.
            ci_jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/attempts/$CI_RUN_ATTEMPT/jobs?per_page=100" \
              --jq '.jobs[] | [.name, (.conclusion // "")] | @tsv')
            conclusion() { printf '%s\n' "$ci_jobs" | awk -F '\t' -v name="$1" '$1 == name { print $2 }'; }
            image_result=$(conclusion "Kit and shell images (build, no push)")
            rust_lanes_passed=true
            while IFS= read -r lane; do
              [ "$(conclusion "$lane")" = success ] || rust_lanes_passed=false
            done <<< "$rust_lanes"
            case "$image_result" in
              success) ;;
              skipped) echo "No image inputs changed; nothing to publish."; echo stages=none >> "$GITHUB_OUTPUT"; exit 0 ;;
              *) echo "::error::expected a successful or skipped CI image job, got: $image_result"; exit 1 ;;
            esac
          fi
          case $GITHUB_EVENT_NAME in
            push) channel=stable; version=${GITHUB_REF_NAME#v}; draft=false ;;
            workflow_dispatch)
              # A manual run publishes images (a nightly, or a rehearsal's
              # :draft) and gets the release environment: main only.
              [ "$GITHUB_REF" = refs/heads/main ] || {
                echo "::error::run the Release workflow by hand on main only (this is $GITHUB_REF)"; exit 1; }
              if [ -n "$INPUT" ]; then channel=stable; version=${INPUT#v}; draft=true
              else channel=nightly; draft=false; fi ;;
            schedule)
              channel=nightly; draft=false
              # The newest commit on main whose CI passed, not necessarily its tip.
              sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
                --jq '.workflow_runs[0].head_sha // empty')
              if [ -z "$sha" ]; then
                echo "No passing CI run on main; no nightly."; stages=none; sha=$(git rev-parse HEAD)
              else
                git checkout -q "$sha"
                last_nightly=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,isPrerelease \
                  --jq '[.[] | select(.isPrerelease and (.tagName | test("-nightly\\.")))][0].tagName // empty')
                if [ -n "$last_nightly" ] && [ "${last_nightly##*.g}" = "$(git rev-parse --short=7 "$sha")" ]; then
                  echo "main has not moved since $last_nightly; no nightly."; stages=none
                fi
              fi ;;
            *) channel=nightly; draft=false; stages=images ;;
          esac
          if [ "$channel" = stable ]; then
            # The ci job below runs every CI lane on this commit before
            # anything is built.
            echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: $version"; exit 1; }
            git merge-base --is-ancestor "$sha" origin/main || { echo "::error::${sha:0:7} is not on main"; exit 1; }
            # The images job narrows these to the version tag alone when a
            # higher version is tagged by the time it runs.
            formula=marsh; image_tag=; extra_tags="$version latest"
            # A draft rehearses the pipeline and announces nothing, so it must not
            # move a tag that users or the next release read (:release, :repaired,
            # :latest) and makes no version tag. Its images get the moving tag
            # :draft; the digests are in the run's artifacts.
            if [ "$draft" = true ]; then image_tag=draft; extra_tags=""; fi
          else
            last=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            base=${last#v}; base=${base:-0.0.0}
            IFS=. read -r major minor patch <<< "$base"
            stamp=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S "$sha")
            version="$major.$minor.$((patch + 1))-nightly.$stamp.g$(git rev-parse --short=7 "$sha")"
            formula=marsh-nightly; image_tag=nightly; extra_tags="$version"
            # A per-commit run builds the Kit images but makes no version tag:
            # the kept nightly image tags are the daily builds'.
            [ "$stages" = images ] && extra_tags=""
            # Only a main build whose CI passed moves the stable Kit tag, and
            # only when that run ran and passed the Rust tests on this commit:
            # they check the Kits' contract, and a green run that skipped them
            # can sit on top of a commit where they failed.
            if [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ -n "$last" ] && [ "$rust_lanes_passed" != true ]; then
              echo "::notice::the Rust lanes did not all run and pass in CI run $CI_RUN_ID; the stable Kit tag stays"
            elif [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ -n "$last" ]; then
              promote_kits=true
              if git show "$last:crates/marsh-contracts/src/kit_source.rs" > "$RUNNER_TEMP/stable-kit-source.rs" 2>/dev/null; then
                stable_contracts=$(python3 scripts/promote-stable-kits.py supported "$RUNNER_TEMP/stable-kit-source.rs")
              fi
            fi
          fi
          {
            echo "stages=$stages"
            echo "channel=$channel"; echo "version=$version"; echo "draft=$draft"; echo "sha=$sha"
            echo "formula=$formula"; echo "image_tag=$image_tag"; echo "extra_tags=$extra_tags"
            echo "promote_kits=$promote_kits"; echo "stable_contracts=$stable_contracts"
          } >> "$GITHUB_OUTPUT"
          echo "### $channel $version (${sha:0:7})" >> "$GITHUB_STEP_SUMMARY"

  # Every CI lane on the commit this run builds. Per-commit runs (stages
  # images) skip it: they follow a push CI run of that commit whose image
  # job passed. The workflow file itself comes from the commit this run was
  # started on. For a tag or a manual run that is the commit it builds; a
  # scheduled nightly builds the newest commit on main whose CI passed, which
  # can be older than main's tip, so tip's ci.yml then drives that older
  # commit's Makefile and scripts: it checks that commit with tip's lane set
  # (the Makefile targets each lane runs are the older commit's), and a lane
  # that needs something newer fails the nightly, which then publishes
  # nothing.
  ci:
    needs: version
    if: needs.version.outputs.stages == 'all'
    permissions:
      contents: read
    # A job-level call resolves at this run's commit, not from a checkout.
    # actionlint does not know the $/ form yet, and it checks this call's
    # inputs and secrets against ci.yml.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      all: true
      ref: ${{ needs.version.outputs.sha }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  guest:
    needs: [version, ci]
    if: needs.version.outputs.stages == 'all'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Stamp the version
        run: python3 scripts/stamp-version.py "${{ needs.version.outputs.version }}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Linux arm64 guest binaries
        run: |
          docker buildx build --platform linux/arm64 \
            --build-arg CARGO_JOBS=4 --build-arg RELEASE_PACKAGING=1 \
            --target export --output type=local,dest=out/guest \
            -f packaging/linux-arm64/Dockerfile .
          ls -l out/guest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest
          path: out/guest
          if-no-files-found: error

  # The images do not contain the marsh version, so this job builds the
  # checkout as committed and does not stamp it.
  # A skipped ci job would skip this job too unless the condition says
  # otherwise: only a per-commit run (stages images) may go without it.
  images:
    needs: [version, ci]
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      (needs.ci.result == 'success' && needs.version.outputs.stages == 'all' ||
       needs.ci.result == 'skipped' && needs.version.outputs.stages == 'images')
    concurrency:
      group: release-images-${{ github.event_name == 'workflow_run' && 'commit' || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
      # The moving tags this run may push, decided when it runs (see the
      # concurrency comment). An older stable version gets its version tag
      # only. Empty image_tag: the publishers' defaults (:release, :repaired).
      - name: Moving tags, decided now
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          DRAFT: ${{ needs.version.outputs.draft }}
          IMAGE_TAG: ${{ needs.version.outputs.image_tag }}
          EXTRA_TAGS: ${{ needs.version.outputs.extra_tags }}
        shell: bash
        run: |
          set -euo pipefail
          image_tag=$IMAGE_TAG; extra_tags=$EXTRA_TAGS
          if [ "$CHANNEL" = stable ] && [ "$DRAFT" = false ]; then
            # A listing that fails, or does not show this version's tag, after
            # the script's retries fails this step, so the job pushes nothing.
            newest=$(sh scripts/newest-release.sh --github "$VERSION")
            if [ "$newest" != true ]; then
              echo "::notice::a version above $VERSION is tagged: publishing its version tags only"
              image_tag=$VERSION; extra_tags=$VERSION
            fi
          fi
          { echo "image_tag=$image_tag"; echo "extra_tags=$extra_tags"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub and Docker Hardened Images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for registry in docker.io dhi.io; do
            printf '%s' "$DOCKERHUB_TOKEN" | docker login "$registry" --username "$DOCKERHUB_USERNAME" --password-stdin
          done
      - name: Publisher dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --no-deps --only-binary=:all: -r scripts/requirements-publish.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Shell VM template
        env:
          IMAGE_TAG: ${{ steps.fresh.outputs.image_tag }}
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/out"
          python3 scripts/prepare-shell-image.py --repository "$SHELL_IMAGE_REPOSITORY" \
            ${IMAGE_TAG:+--tag "$IMAGE_TAG"} --output "$RUNNER_TEMP/out/shell-image"
      - name: Services engine image
        run: python3 scripts/prepare-svc-engine-image.py --docker docker --output "$RUNNER_TEMP/out"
      - name: Kits
        env:
          IMAGE_TAG: ${{ steps.fresh.outputs.image_tag }}
        run: |
          make kit-publish KIT_REPOSITORY_PREFIX="$KIT_REPOSITORY_PREFIX" KIT_TAG="$IMAGE_TAG" \
            TARGET_DIR="$RUNNER_TEMP/target" KIT_RELEASE_COMMANDS="$RUNNER_TEMP/out/commands.json"
      - name: Acceptance fixture Kit
        env:
          IMAGE_TAG: ${{ steps.fresh.outputs.image_tag }}
        run: |
          make kit-publish-fixture KIT_REPOSITORY_PREFIX="$KIT_REPOSITORY_PREFIX" KIT_REPOSITORY_NAME_PREFIX=marsh- KIT_TAG="$IMAGE_TAG" \
            TARGET_DIR="$RUNNER_TEMP/target" KIT_FIXTURE_COMMANDS="$RUNNER_TEMP/out/fixture-commands.json"
          python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["fixture"])' \
            "$RUNNER_TEMP/out/fixture-commands.json" > "$RUNNER_TEMP/out/fixture-ref.txt"
      # The moving tag (:release or :nightly) was pushed above; add the tags
      # that name this build. Consumers still pin by digest.
      - name: Tag every image with this version
        env:
          EXTRA_TAGS: ${{ steps.fresh.outputs.extra_tags }}
        run: |
          out="$RUNNER_TEMP/out"
          refs=$({ cat "$out/shell-image" "$out/fixture-ref.txt"; jq -r '.[]' "$out/commands.json"; } | sort -u)
          for ref in $refs; do
            for tag in $EXTRA_TAGS; do
              docker buildx imagetools create --tag "${ref%@*}:$tag" "$ref"
            done
          done
      # The rule is at the top of this file. A failure here never blocks the
      # nightly: stable users keep the :latest they have.
      - name: Move the stable Kit tag (:latest) when the newest stable marsh supports it
        if: needs.version.outputs.promote_kits == 'true'
        continue-on-error: true
        env:
          STABLE_CONTRACTS: ${{ needs.version.outputs.stable_contracts }}
        run: |
          {
            echo '### Stable Kit tag'
            echo '```'
            python3 scripts/promote-stable-kits.py promote --apply \
              --commands "$RUNNER_TEMP/out/commands.json" --supported "$STABLE_CONTRACTS"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Record digests
        run: |
          cat "$RUNNER_TEMP/out/shell-image" "$RUNNER_TEMP/out/commands.json" "$RUNNER_TEMP/out/fixture-ref.txt"
          {
            echo '### Published images'
            echo '```'
            cat "$RUNNER_TEMP/out/shell-image"
            cat "$RUNNER_TEMP/out/commands.json"
            cat "$RUNNER_TEMP/out/fixture-ref.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: |
            ${{ runner.temp }}/out/shell-image
            ${{ runner.temp }}/out/shell-image.build.json
            ${{ runner.temp }}/out/svc-engine.tar
            ${{ runner.temp }}/out/svc-engine-image.json
            ${{ runner.temp }}/out/commands.json
            ${{ runner.temp }}/out/fixture-ref.txt
          if-no-files-found: error

  host:
    needs: [version, guest, images]
    if: needs.version.outputs.stages == 'all'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FORMULA_CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Stamp the version
        run: python3 scripts/stamp-version.py "$VERSION"
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guest
          path: target/libexec/marsh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: target/images
      - name: Host binaries
        env:
          MARSH_RELEASE_PACKAGING: "1"
        run: make build-host
      - name: Package
        run: |
          chmod 755 target/libexec/marsh/*-linux-arm64
          cp target/images/shell-image target/images/shell-image.build.json target/libexec/marsh/
          cp target/images/svc-engine.tar target/images/svc-engine-image.json target/libexec/marsh/
          make dist VERSION="$VERSION" KIT_COMMANDS=target/images/commands.json
          make formula VERSION="$VERSION" FORMULA_CHANNEL="$FORMULA_CHANNEL"
          cp target/images/fixture-ref.txt target/dist/
      - name: Install the tarball and run it
        run: |
          sh scripts/install.sh --tarball "target/dist/marsh-$VERSION-darwin-arm64.tar.gz" --prefix "$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix/bin/marsh" --version | grep -qx "marsh $VERSION"
          "$RUNNER_TEMP/prefix/bin/msh" --help >/dev/null
          # The installed daemon must accept its own packaged commands.json
          # and shell-image (offline: no sbx, VM or network).
          "$RUNNER_TEMP/prefix/bin/marshd" --check-config
          MANPATH="$RUNNER_TEMP/prefix/share/man" man -w marsh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: target/dist
          if-no-files-found: error

  # A rehearsal (draft) stops at the dist artifact: a GitHub draft release
  # becomes a public, ungated release when someone publishes it.
  release:
    needs: [version, host]
    if: needs.version.outputs.draft == 'false'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      FORMULA: ${{ needs.version.outputs.formula }}
      SHA: ${{ needs.version.outputs.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # scripts/newest-release.sh, from the commit being released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
          sparse-checkout: scripts/newest-release.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Check the checksum
        working-directory: dist
        run: sha256sum -c "marsh-$VERSION-darwin-arm64.tar.gz.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/marsh-${{ env.VERSION }}-darwin-arm64.tar.gz
      # A token-created tag does not start another workflow run, so a nightly's
      # tag (which also matches v*.*.*) cannot re-trigger this one.
      # Creating the release has failed twice with HTTP 403 "Resource not
      # accessible by integration", a few seconds in, on 2026-10-24 (the next
      # run succeeded both times). Retry. An attempt may have created the release
      # before failing, so a later attempt finishes it by uploading the assets,
      # but only when the release was created after this step started. A release
      # that already existed is never overwritten.
      - name: Create the GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          started=$(date -u +%s)
          args=(--repo "$GITHUB_REPOSITORY" --target "$SHA")
          if [ "$CHANNEL" = nightly ]; then
            args+=(--prerelease --latest=false --title "marsh $VERSION (nightly)"
                   --notes "Nightly build of ${SHA:0:7}. Install: brew install mcavage/tap/marsh-nightly")
          else
            args+=(--title "marsh $VERSION" --generate-notes)
            # Decided now (see the concurrency comment): an older version
            # never takes the "Latest" mark. A failed or partial listing
            # fails this step before any release is created.
            newest=$(sh scripts/newest-release.sh --github "$VERSION")
            if [ "$newest" = true ]; then args+=(--latest); else args+=(--latest=false); fi
          fi
          files=("dist/marsh-$VERSION-darwin-arm64.tar.gz"
                 "dist/marsh-$VERSION-darwin-arm64.tar.gz.sha256"
                 dist/fixture-ref.txt "dist/$FORMULA.rb")
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ] && made=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json createdAt --jq .createdAt 2>/dev/null); then
              made=$(python3 -c 'import datetime,sys; print(int(datetime.datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00")).timestamp()))' "$made")
              if [ "$made" -lt $((started - 60)) ]; then
                echo "::error::release v$VERSION already existed before this step; not overwriting it"; exit 1
              fi
              gh release upload "v$VERSION" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber && exit 0
            elif gh release create "v$VERSION" "${args[@]}" "${files[@]}"; then
              exit 0
            fi
            [ "$attempt" = 3 ] && { echo "::error::could not create the release after $attempt attempts"; exit 1; }
            echo "Attempt $attempt failed; retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
      - name: Keep the newest 10 nightly releases
        if: env.CHANNEL == 'nightly'
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-nightly\\.")))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done

  tap:
    needs: [version, release]
    if: needs.version.outputs.draft == 'false'
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FORMULA: ${{ needs.version.outputs.formula }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # scripts/newest-release.sh, from the commit being released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
          sparse-checkout: scripts/newest-release.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # The tap also holds other formulae (Formula/pix.rb) and its own
      # .github/workflows. This job writes exactly one path, Formula/$FORMULA.rb,
      # and refuses to push if anything else would change. A stable release and
      # a nightly can finish together, so a rejected push is retried from a
      # fresh clone.
      - name: Update mcavage/homebrew-tap
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then echo "HOMEBREW_TAP_TOKEN not set; skipping the tap"; exit 0; fi
          # Decided now (see the concurrency comment). A failed or partial
          # listing fails this step before the tap is touched.
          if [ "$FORMULA" = marsh ]; then
            newest=$(sh scripts/newest-release.sh --github "$VERSION")
            if [ "$newest" != true ]; then echo "a version above $VERSION is tagged; the $FORMULA formula stays"; exit 0; fi
          fi
          case $FORMULA in marsh) class=Marsh;; marsh-nightly) class=MarshNightly;; *) echo "unknown formula $FORMULA" >&2; exit 1;; esac
          file="Formula/$FORMULA.rb"
          grep -q "^class $class < Formula\$" "dist/$FORMULA.rb" || { echo "dist/$FORMULA.rb is not the $FORMULA formula" >&2; exit 1; }
          for attempt in 1 2 3 4; do
            rm -rf tap
            git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/mcavage/homebrew-tap.git" tap
            cd tap
            base=$(git rev-parse HEAD)
            branch=$(git symbolic-ref --short HEAD)
            if [ -e "$file" ] && { [ -L "$file" ] || [ ! -f "$file" ]; }; then
              echo "tap $file is not a regular file" >&2; exit 1
            fi
            # Never move the tap back, whatever this run was told.
            current=$( [ -f "$file" ] && sed -n 's#.*/releases/download/v\([^/"]*\)/.*#\1#p' "$file" | head -n 1 || true)
            if [ -n "$current" ] && [ "$current" != "$VERSION" ] &&
               [ "$(printf '%s\n' "$current" "$VERSION" | sort -V | tail -n 1)" = "$current" ]; then
              echo "the tap has $FORMULA $current, newer than $VERSION; not writing it"; exit 0
            fi
            mkdir -p Formula
            cp "../dist/$FORMULA.rb" "$file"
            git config user.name "marsh release"
            git config user.email "marsh-release@users.noreply.github.com"
            git add -- "$file"
            changed=$(git status --porcelain --untracked-files=all)
            if [ -z "$changed" ]; then echo "tap already has $FORMULA $VERSION; nothing to push"; exit 0; fi
            if [ "$changed" != "M  $file" ] && [ "$changed" != "A  $file" ]; then
              printf 'refusing to push: tap changes outside %s:\n%s\n' "$file" "$changed" >&2; exit 1
            fi
            git commit -q -m "$FORMULA $VERSION"
            paths=$(git diff --name-only "$base" HEAD)
            if [ "$paths" != "$file" ]; then
              printf 'refusing to push: commit touches:\n%s\n' "$paths" >&2; exit 1
            fi
            if git push origin "HEAD:refs/heads/$branch"; then exit 0; fi
            echo "tap push rejected (attempt $attempt); retrying" >&2
            cd ..
            sleep $((attempt * 5))
          done
          echo "could not push the tap after 4 attempts" >&2
          exit 1
