name: Release
# Tag vX.Y.Z (matching Cargo.toml's workspace version) to publish a release:
#   1. guest:   Linux arm64 guest binaries (Buildx)
#   2. images:  log in to Docker Hub (docker.io and dhi.io), build and push the
#               shell template and Kit images to docker.io/mcavage/marsh-*, and
#               record their digests
#   3. host:    macOS arm64 host binaries; pin the digests into commands.json and
#               shell-image; package marsh-X.Y.Z-darwin-arm64.tar.gz + .sha256
#   4. release: GitHub Release with the tarball, checksum, fixture-ref.txt and
#               the rendered Homebrew formula
#   5. tap:     push Formula/marsh.rb to mcavage/homebrew-tap
# workflow_dispatch builds everything and makes a draft release; images are
# still pushed (by digest) but nothing is announced.
#
# Secrets:
#   DOCKERHUB_USERNAME,       Docker account that can push docker.io/mcavage/*
#   DOCKERHUB_TOKEN           and pull dhi.io base images (one login for both)
#   HOMEBREW_TAP_TOKEN        token with contents:write on mcavage/homebrew-tap
#                             (optional; the tap job is skipped without it)
# New Docker Hub repositories may default to private: make each public once.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (X.Y.Z); creates a draft release'
        required: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  KIT_REPOSITORY_PREFIX: docker.io/mcavage
  SHELL_IMAGE_REPOSITORY: docker.io/mcavage/marsh-shell-template
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      draft: ${{ steps.v.outputs.draft }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then version=${GITHUB_REF_NAME#v}; draft=false
          else version=${INPUT#v}; draft=true; fi
          case $version in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "bad version: $version"; exit 1;; esac
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$cargo_version" != "$version" ]; then
            echo "tag $version does not match Cargo.toml version $cargo_version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

  guest:
    needs: version
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build Linux arm64 guest binaries
        run: |
          docker buildx build --platform linux/arm64 \
            --build-arg CARGO_JOBS=4 \
            --target export --output type=local,dest=out/guest \
            -f packaging/linux-arm64/Dockerfile .
          ls -l out/guest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guest
          path: out/guest
          if-no-files-found: error

  images:
    needs: version
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Log in to Docker Hub and Docker Hardened Images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for registry in docker.io dhi.io; do
            printf '%s' "$DOCKERHUB_TOKEN" | docker login "$registry" --username "$DOCKERHUB_USERNAME" --password-stdin
          done
      - name: Publisher dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --no-deps --only-binary=:all: -r scripts/requirements-publish.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Shell VM template
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/out"
          python3 scripts/prepare-shell-image.py --repository "$SHELL_IMAGE_REPOSITORY" \
            --output "$RUNNER_TEMP/out/shell-image"
      - name: Kits
        run: |
          make kit-publish KIT_REPOSITORY_PREFIX="$KIT_REPOSITORY_PREFIX" \
            TARGET_DIR="$RUNNER_TEMP/target" KIT_RELEASE_COMMANDS="$RUNNER_TEMP/out/commands.json"
      - name: Acceptance fixture Kit
        run: |
          make kit-publish-fixture KIT_REPOSITORY_PREFIX="$KIT_REPOSITORY_PREFIX" KIT_REPOSITORY_NAME_PREFIX=marsh- \
            TARGET_DIR="$RUNNER_TEMP/target" KIT_FIXTURE_COMMANDS="$RUNNER_TEMP/out/fixture-commands.json"
          python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["fixture"])' \
            "$RUNNER_TEMP/out/fixture-commands.json" > "$RUNNER_TEMP/out/fixture-ref.txt"
      - name: Record digests
        run: |
          cat "$RUNNER_TEMP/out/shell-image" "$RUNNER_TEMP/out/commands.json" "$RUNNER_TEMP/out/fixture-ref.txt"
          {
            echo '### Published images'
            echo '```'
            cat "$RUNNER_TEMP/out/shell-image"
            cat "$RUNNER_TEMP/out/commands.json"
            cat "$RUNNER_TEMP/out/fixture-ref.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: images
          path: |
            ${{ runner.temp }}/out/shell-image
            ${{ runner.temp }}/out/shell-image.build.json
            ${{ runner.temp }}/out/commands.json
            ${{ runner.temp }}/out/fixture-ref.txt
          if-no-files-found: error

  host:
    needs: [version, guest, images]
    runs-on: macos-14
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: guest
          path: target/libexec/marsh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: images
          path: target/images
      - name: Host binaries
        run: cargo build --workspace --release --locked
      - name: Package
        run: |
          chmod 755 target/libexec/marsh/*-linux-arm64
          cp target/images/shell-image target/images/shell-image.build.json target/libexec/marsh/
          make dist VERSION="$VERSION" KIT_COMMANDS=target/images/commands.json
          make formula VERSION="$VERSION"
          cp target/images/fixture-ref.txt target/dist/
      - name: Install the tarball and run it
        run: |
          sh scripts/install.sh --tarball "target/dist/marsh-$VERSION-darwin-arm64.tar.gz" --prefix "$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix/bin/marsh" --version | grep -qx "marsh $VERSION"
          "$RUNNER_TEMP/prefix/bin/msh" --help >/dev/null
          MANPATH="$RUNNER_TEMP/prefix/share/man" man -w marsh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: target/dist
          if-no-files-found: error

  release:
    needs: [version, host]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DRAFT: ${{ needs.version.outputs.draft }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Check the checksum
        working-directory: dist
        run: sha256sum -c "marsh-$VERSION-darwin-arm64.tar.gz.sha256"
      - uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-path: dist/marsh-${{ env.VERSION }}-darwin-arm64.tar.gz
      - name: Create the GitHub Release
        run: |
          draft=; [ "$DRAFT" = true ] && draft=--draft
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" $draft \
            --title "marsh $VERSION" --generate-notes --target "$GITHUB_SHA" \
            "dist/marsh-$VERSION-darwin-arm64.tar.gz" \
            "dist/marsh-$VERSION-darwin-arm64.tar.gz.sha256" \
            dist/fixture-ref.txt dist/marsh.rb

  tap:
    needs: [version, release]
    if: needs.version.outputs.draft == 'false'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      # The tap also holds other formulae (Formula/pix.rb) and its own
      # .github/workflows. This job writes exactly one path, Formula/marsh.rb,
      # and refuses to push if anything else would change.
      - name: Update mcavage/homebrew-tap
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then echo "HOMEBREW_TAP_TOKEN not set; skipping the tap"; exit 0; fi
          grep -q '^class Marsh < Formula$' dist/marsh.rb || { echo "dist/marsh.rb is not the marsh formula" >&2; exit 1; }
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/mcavage/homebrew-tap.git" tap
          cd tap
          base=$(git rev-parse HEAD)
          branch=$(git symbolic-ref --short HEAD)
          if [ -e Formula/marsh.rb ] && { [ -L Formula/marsh.rb ] || [ ! -f Formula/marsh.rb ]; }; then
            echo "tap Formula/marsh.rb is not a regular file" >&2; exit 1
          fi
          mkdir -p Formula
          cp ../dist/marsh.rb Formula/marsh.rb
          git config user.name "marsh release"
          git config user.email "marsh-release@users.noreply.github.com"
          git add -- Formula/marsh.rb
          changed=$(git status --porcelain --untracked-files=all)
          if [ -z "$changed" ]; then echo "tap already has marsh $VERSION; nothing to push"; exit 0; fi
          if [ "$changed" != "M  Formula/marsh.rb" ] && [ "$changed" != "A  Formula/marsh.rb" ]; then
            printf 'refusing to push: tap changes outside Formula/marsh.rb:\n%s\n' "$changed" >&2; exit 1
          fi
          git commit -q -m "marsh $VERSION"
          paths=$(git diff --name-only "$base" HEAD)
          if [ "$paths" != "Formula/marsh.rb" ]; then
            printf 'refusing to push: commit touches:\n%s\n' "$paths" >&2; exit 1
          fi
          git push origin "HEAD:refs/heads/$branch"
