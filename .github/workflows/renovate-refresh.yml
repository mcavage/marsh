name: Refresh pins
# Called by CI before validating a Renovate PR. Runs against the exact head,
# regenerates records, commits changes with RENOVATE_TOKEN, and posts the
# license verdict. A generated commit gets its own CI run; this run returns
# ready=false so no checks validate the obsolete raw-pins revision.
# Generated heads reuse their records and proceed straight to validation.
#
# Secrets:
#   RENOVATE_TOKEN          pushes the regenerated records, so CI runs on them
#                           (a GITHUB_TOKEN push would not trigger it), sets the
#                           commit status and writes the PR comment
#                           (Contents, Pull requests, Issues, Commit statuses
#                           read/write; see renovate.yml)
#   DOCKERHUB_USERNAME      the Docker account
#   DOCKERHUB_READ_TOKEN    its read-only token: pulls the dhi.io bases
#
# The commit is authored by refresh-pins@users.noreply.github.com, which
# .github/renovate.json5 lists in gitIgnoredAuthors, so Renovate keeps managing
# the branch. A call on that commit reuses its already generated records.
on:
  workflow_call:
    inputs:
      branch:
        type: string
        required: true
      sha:
        type: string
        required: true
    outputs:
      ready:
        description: 'Records are ready on the input SHA; false when superseded by a prepared commit.'
        value: ${{ jobs.refresh.outputs.ready }}
permissions:
  contents: read
env:
  BOT_NAME: marsh refresh-pins
  BOT_EMAIL: refresh-pins@users.noreply.github.com
jobs:
  refresh:
    name: Refresh pins
    if: github.repository == 'mcavage/marsh'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    # Superseded preparations must finish posting their exact-head verdict.
    concurrency:
      group: refresh-pins-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}
          token: ${{ secrets.RENOVATE_TOKEN }}
      - name: Inspect the exact PR head
        id: inspect
        env:
          BRANCH: ${{ inputs.branch }}
          EXPECTED_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          git fetch --no-tags origin "$BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$EXPECTED_SHA" ]; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            gh api "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_SHA" -f state=pending \
              -f context='Prepared dependency validation' -f description='Preparing records before CI validation' >/dev/null
            verdict=$(gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/status" \
              --jq '.statuses[] | select(.context == "License review") | .state')
            if [ "$(git log -1 --format=%ae)" = "$BOT_EMAIL" ] &&
               { [ "$verdict" = success ] || [ "$verdict" = failure ]; }; then
              echo 'required=false' >> "$GITHUB_OUTPUT"
              echo 'ready=true' >> "$GITHUB_OUTPUT"
            else
              echo 'required=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.inspect.outputs.required == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.inspect.outputs.required == 'true'
        with:
          go-version: stable
          cache: false
      - name: Log in to Docker Hub and Docker Hardened Images
        if: steps.inspect.outputs.required == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_READ_TOKEN: ${{ secrets.DOCKERHUB_READ_TOKEN }}
        run: |
          for registry in docker.io dhi.io; do
            printf '%s' "$DOCKERHUB_READ_TOKEN" | docker login "$registry" --username "$DOCKERHUB_USERNAME" --password-stdin
          done
      - name: Publisher dependencies
        if: steps.inspect.outputs.required == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --no-deps --only-binary=:all: -r scripts/requirements-publish.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: make refresh-pins
        if: steps.inspect.outputs.required == 'true'
        id: refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REFRESH_CACHE: ${{ runner.temp }}/refresh-cache
        run: |
          set +e
          git fetch --no-tags origin main
          # The script, not make: its status is the verdict (make maps every
          # failure to 2).
          python3 scripts/refresh-pins.py --base origin/main 2>&1 | tee "$RUNNER_TEMP/refresh.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != 1 ] && [ -f target/refresh-pins/license-delta.md ]; then
            cat target/refresh-pins/license-delta.md >> "$GITHUB_STEP_SUMMARY"
          else
            { echo '<!-- marsh-refresh-pins -->'; echo '## License delta'; echo
              echo '**make refresh-pins failed**; the records are not regenerated. Last lines:'
              echo; echo '```'; tail -40 "$RUNNER_TEMP/refresh.log"; echo '```'; } > "$RUNNER_TEMP/failed.md"
            cat "$RUNNER_TEMP/failed.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit the regenerated records
        id: commit
        env:
          BRANCH: ${{ inputs.branch }}
        if: steps.inspect.outputs.required == 'true' && (steps.refresh.outputs.status == '0' || steps.refresh.outputs.status == '2')
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Records are current."; echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git add -A
          git -c user.name="$BOT_NAME" -c user.email="$BOT_EMAIL" -c commit.gpgsign=false \
            commit -q -m "Regenerate pinned records (make refresh-pins)" \
            -m "License delta: $(grep -m1 -o 'Verdict: [A-Z-]*' target/refresh-pins/license-delta.md)"
          git push origin "HEAD:$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: License review status and PR comment
        if: always() && steps.inspect.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          BRANCH: ${{ inputs.branch }}
          STATUS: ${{ steps.refresh.outputs.status }}
          SHA: ${{ steps.commit.outputs.sha || inputs.sha }}
          EXPECTED_SHA: ${{ inputs.sha }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          case "$STATUS" in
            0) state=success; description="License delta OK" ;;
            2) state=failure; description="License delta NEEDS-OWNER: see the PR comment" ;;
            *) state=error; description="make refresh-pins failed: records not regenerated" ;;
          esac
          if [ "$COMMIT_OUTCOME" = failure ]; then
            state=error; description="Prepared records could not be pushed"
          fi
          if [ "$SHA" != "$EXPECTED_SHA" ]; then
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending \
              -f context='Prepared dependency validation' -f description='Records prepared; waiting for CI on this commit' >/dev/null
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="License review" \
            -f description="$description" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          body=target/refresh-pins/license-delta.md
          [ "$STATUS" = 0 ] || [ "$STATUS" = 2 ] || body="$RUNNER_TEMP/failed.md"
          if [ ! -f "$body" ]; then
            printf '<!-- marsh-refresh-pins -->\n## Record preparation failed\nSee the failed workflow step for details.\n' > "$RUNNER_TEMP/failed.md"
            body="$RUNNER_TEMP/failed.md"
          fi
          # This workflow is called for an existing pull request.
          for attempt in $(seq 1 12); do
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')
            [ -n "$pr" ] && break
            sleep 15
          done
          if [ -z "$pr" ]; then echo "No open PR for $BRANCH; the report is in the job summary."; exit 0; fi
          comment=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- marsh-refresh-pins -->"))][0].id')
          if [ -n "$comment" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -F body=@"$body" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -F body=@"$body" >/dev/null
          fi
      - name: Verdict
        if: steps.inspect.outputs.required == 'true' && steps.refresh.outputs.status != '0'
        run: |
          echo "make refresh-pins exited ${{ steps.refresh.outputs.status }} (2 = NEEDS-OWNER, 1 = failed)"
          exit 1
      - name: Ready for validation
        id: ready
        if: success()
        env:
          ALREADY_READY: ${{ steps.inspect.outputs.ready }}
          GENERATED_SHA: ${{ steps.commit.outputs.sha }}
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          if [ "$ALREADY_READY" = true ] || [ "$GENERATED_SHA" = "$EXPECTED_SHA" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'A newer prepared commit will receive its own CI run.'
          fi
